<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espectral RPG — Arquivo de Espectros</title>
<style>
:root{--a:#ffcc00;--ac:255,204,0;--bg:#0b0b0d;--glass:rgba(18,18,22,.62);--bd:rgba(255,255,255,.12);--tx:#ececec;--mut:#8b8b95;--ok:#4ade80;--bad:#ff4d5e;--mono:ui-monospace,"Courier New",Consolas,monospace;box-sizing:border-box}
body[data-tema=visceral]{--a:#ff2b3a;--ac:255,43,58}
body[data-tema=desespero]{--a:#b66cff;--ac:182,108,255}
body[data-tema=fantasmagorico]{--a:#2ee6c0;--ac:46,230,192}
body[data-tema=escuridao]{--a:#9aa0aa;--ac:154,160,170}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.app{position:relative;z-index:1;display:flex;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.45),inset 0 0 0 1px rgba(var(--ac),.05)}
aside{width:250px;flex:none;margin:12px 0 12px 12px;padding:14px 10px;display:flex;flex-direction:column}
.logo{font-family:var(--mono);color:var(--a);text-align:center;letter-spacing:3px;font-size:13px;margin:0 0 4px;text-transform:uppercase}
.sub{font-family:var(--mono);font-size:9px;text-align:center;color:var(--mut);margin-bottom:12px;letter-spacing:2px}
#lista{flex:1;overflow:auto}
.ag{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.25s;background:rgba(0,0,0,.25)}
.ag:hover,.ag.on{border-color:var(--a);box-shadow:inset 0 0 14px rgba(var(--ac),.18)}
.ag img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--bd)}
.ag b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ag small{color:var(--mut);font-family:var(--mono);font-size:10px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:rgba(var(--ac),.08);color:var(--a);border:1px solid rgba(var(--ac),.4);padding:8px 14px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;transition:.2s}
.btn:hover{background:var(--a);color:#000}
.btn.red{color:var(--bad);border-color:rgba(255,77,94,.4);background:rgba(255,77,94,.07)}
.btn.red:hover{background:var(--bad);color:#000}
.btn.sm{padding:4px 9px;font-size:10px}
input,select,textarea{background:rgba(0,0,0,.5);border:1px solid var(--bd);border-radius:5px;padding:6px 8px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
select option{background:#111}
textarea{resize:vertical;min-height:90px}
main{flex:1;min-width:0;overflow:auto;padding:12px}
.wrap{max-width:1020px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.glitch{font-family:var(--mono);font-size:20px;letter-spacing:4px;color:var(--a);position:relative;text-transform:uppercase;margin:0}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:0}
.glitch::before{color:#f0f;animation:gl 5s infinite}
.glitch::after{color:#0ff;animation:gl 5s .15s infinite}
@keyframes gl{0%,92%,100%{opacity:0;transform:none}93%{opacity:.8;transform:translate(-3px,1px);clip-path:inset(10% 0 55% 0)}95%{opacity:.8;transform:translate(3px,-1px);clip-path:inset(60% 0 8% 0)}97%{opacity:0}}
.tabs{display:flex;overflow:auto;margin-bottom:10px;padding:0}
.tabs button{flex:1;min-width:84px;background:none;border:0;border-bottom:3px solid transparent;padding:13px 8px;color:var(--mut);font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:1px;cursor:pointer;transition:.25s}
.tabs button.on{color:var(--a);border-color:var(--a);background:rgba(var(--ac),.07)}
.tab{display:none;padding:20px;animation:fi .4s}
.tab.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--mono);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--a);margin:0 0 14px}
h2::before{content:"// ";opacity:.5}
.row{display:grid;grid-template-columns:230px 1fr;gap:16px}
.ident{display:grid;gap:8px;align-content:start}
#foto{width:110px;height:110px;border-radius:10px;border:2px solid var(--bd);object-fit:cover;cursor:pointer;margin:4px auto 0;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;align-content:start}
.st label{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;gap:6px}
.st .n{display:flex;gap:4px;align-items:center}
.st input{width:52px;text-align:center;padding:3px}
.bar{height:9px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;transition:width .5s,background .3s;border-radius:5px}
.cat{margin-top:14px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2)}
.cat header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(var(--ac),.07);cursor:pointer;font-family:var(--mono);font-size:12px;text-transform:uppercase;color:var(--a)}
.tag{background:rgba(0,0,0,.5);border:1px solid var(--bd);border-radius:10px;padding:1px 9px;font-size:10px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.cat.fechado .grid{display:none}
.per{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:7px;padding:7px}
.per label{font-size:11px;text-transform:capitalize;display:flex;justify-content:space-between}
.per label em{font-style:normal;color:var(--ok);font-weight:700;font-size:10px}
.per div{display:flex;gap:8px;align-items:center;margin-top:5px}
.per input{width:56px;padding:3px 5px}
.per strong{color:var(--a);font-size:18px;font-family:var(--mono);margin-left:auto}
.dado{width:140px;height:140px;margin:18px auto;display:flex;align-items:center;justify-content:center;font:700 38px var(--mono);color:var(--a);border:2px solid rgba(var(--ac),.5);background:radial-gradient(circle,rgba(var(--ac),.18),transparent 70%);clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
.dado.rola{animation:giro .7s linear}
@keyframes giro{to{transform:rotate(720deg) scale(1.15)}}
.res{text-align:center;font:700 26px var(--mono);margin-top:6px;min-height:34px}
.det{text-align:center;color:var(--mut);font-size:12px;font-family:var(--mono);margin-top:4px}
.center{text-align:center}
.tabela{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:11px}
.tabela span{border:1px solid var(--bd);border-radius:4px;padding:2px 8px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px;margin-bottom:6px;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:7px}
.item.inv{grid-template-columns:1fr 80px auto}
.add{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.add input{flex:1;min-width:120px}
#bandeja{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:70px;margin-top:20px}
.die{width:54px;height:54px;display:flex;align-items:center;justify-content:center;font:700 20px var(--mono);border-radius:9px;background:linear-gradient(145deg,rgba(var(--ac),.35),rgba(0,0,0,.6));border:1px solid var(--a);animation:queda .7s cubic-bezier(.3,1.5,.5,1) both;position:relative}
.die small{position:absolute;bottom:1px;right:4px;font-size:8px;color:var(--mut)}
@keyframes queda{from{transform:translateY(-220px) rotate(-300deg);opacity:0}60%{opacity:1}}
.carga{padding:14px;margin-bottom:14px}
.carga .bar{height:16px}
.carga.over .bar i{background:var(--bad)!important;animation:pulso .8s infinite alternate}
@keyframes pulso{to{opacity:.45}}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:rgba(0,0,0,.28);overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.card>header:hover{background:rgba(var(--ac),.06)}
.card .tp{font:10px var(--mono);border:1px solid rgba(var(--ac),.5);color:var(--a);padding:1px 7px;border-radius:9px;text-transform:uppercase}
.card .cb{display:none;padding:12px;gap:8px;grid-template-columns:1fr 110px 170px}
.card.aberto .cb{display:grid;animation:fi .3s}
.card .full{grid-column:1/-1}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtros .btn.on{background:var(--a);color:#000}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.box{width:100%;max-width:440px;padding:20px;max-height:90%;overflow:auto}
.livro{max-width:620px;perspective:1400px;min-height:360px;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(var(--ac),.07) 50%,rgba(0,0,0,.5))}
.pag{animation:vira .55s ease;transform-origin:left center;font-family:Georgia,serif}
@keyframes vira{from{transform:rotateY(-80deg);opacity:0}}
.pag h3{font-family:var(--mono);color:var(--a);margin:6px 0;font-size:20px}
.pag p{white-space:pre-wrap;line-height:1.7}
.tem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
.tem .btn.on{background:var(--a);color:#000}
#salvo{font:10px var(--mono);color:var(--mut);text-align:center;margin-top:8px;transition:.3s}
#salvo.v{color:var(--ok)}
.bkbox{max-width:940px;background:rgba(10,8,10,.9)}
.bk{position:relative;perspective:2000px;min-height:380px}
.marc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.marc .on{background:var(--a);color:#000}
.spread{display:grid;grid-template-columns:1fr 1fr;perspective:1500px;border:1px solid var(--bd);border-radius:8px;min-height:340px;background:linear-gradient(90deg,#17120f,#221a14 49%,#0c0a08 50%,#221a14 51%,#17120f);box-shadow:inset 0 0 40px rgba(0,0,0,.7)}
.pg{padding:18px 22px;display:flex;flex-direction:column;max-height:56vh;overflow:auto;font-family:Georgia,serif}
.pg+.pg{border-left:1px solid rgba(0,0,0,.6);transform-origin:left center}
.spread.anim .pg+.pg{animation:vira .55s ease}
.spread.anim .pg:first-child{animation:fi .45s}
.pg h3{font-family:var(--mono);color:var(--a);margin:0 0 6px;font-size:18px}
.pg h3 small{font-size:11px;opacity:.7}
.pg p{white-space:pre-wrap;line-height:1.6;flex:1;margin:6px 0}
.pg .campos{display:flex;flex-wrap:wrap;gap:4px 14px;font:11px var(--mono);color:var(--mut);margin-bottom:8px}
.pg .campos b{color:var(--a)}
.rod{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pg.lock{grid-column:1/-1;align-items:center;justify-content:center;text-align:center}
.capa{position:absolute;inset:0;z-index:5;transform-origin:left center;transition:transform 1.2s cubic-bezier(.65,0,.25,1);background:radial-gradient(circle at 50% 40%,rgba(var(--ac),.25),transparent 60%),linear-gradient(135deg,#1b0d10,#050505);border:2px solid var(--a);border-radius:6px 14px 14px 6px;display:flex;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;box-shadow:0 0 40px rgba(var(--ac),.35)}
.capa h3{font:22px var(--mono);color:var(--a);letter-spacing:3px;text-transform:uppercase;margin:10px}
.capa .sg{font-size:54px}
.bk.aberto .capa{transform:rotateY(-178deg)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;font-size:22px;padding:0;background:rgba(var(--ac),.18);backdrop-filter:blur(8px);box-shadow:0 0 20px rgba(var(--ac),.45)}
.nbox{max-width:840px;z-index:1}
.nstage{position:relative;aspect-ratio:900/560;width:100%;border:1px solid var(--bd);border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden}
#nTxt{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;border:0;border-radius:0;font:15px/1.6 Georgia,serif;padding:10px 14px}
#nCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;cursor:crosshair}
.nstage.des #nCv{pointer-events:auto}.nstage.des #nTxt{pointer-events:none}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{border-color:#fff;transform:scale(1.18)}
#nTools input[type=range]{width:90px;padding:0}
@media(max-width:820px){.spread{grid-template-columns:1fr}.pg+.pg{border-left:0;border-top:1px solid rgba(0,0,0,.6)}.app{flex-direction:column}aside{width:auto;margin:8px 8px 0;max-height:150px;padding:8px}#lista{display:flex;gap:8px;overflow:auto}.ag{min-width:170px;margin:0}.row{grid-template-columns:1fr}.card .cb{grid-template-columns:1fr}.tab{padding:14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body data-tema="padrao">
<canvas id="bg"></canvas>
<div class="app">
<aside class="glass">
  <h3 class="logo">Espectros</h3><div class="sub">ARQUIVO CONFIDENCIAL</div>
  <div id="lista"></div>
  <button class="btn" style="margin-top:10px" onclick="novo()">+ Novo Espectro</button>
  <div id="salvo">● salvo</div>
</aside>
<main><div class="wrap">
  <div class="top"><h1 class="glitch" data-t="Espectral RPG">Espectral RPG</h1><button class="btn" onclick="abrirCfg()">⚙ Config</button></div>
  <nav class="tabs glass" id="tabs"></nav>

  <section class="tab glass on" id="t-esp">
    <h2>Identificação</h2>
    <div class="row">
      <div class="ident">
        <input id="nome" placeholder="Nome do Espectro" oninput="campo('nome',this.value)">
        <select id="classe" onchange="campo('classe',this.value);calc();renderPoderes()"><option value="">Classe...</option></select>
        <input id="ocup" placeholder="Ocupação" oninput="campo('ocupacao',this.value)">
        <img id="foto" alt="Foto" onclick="$('inFoto').click()"><input type="file" id="inFoto" accept="image/*" hidden onchange="upFoto(this)">
      </div>
      <div class="stats glass" id="stats"></div>
    </div>
    <div class="flex" style="margin-top:16px"><h2 style="margin:0">Perícias</h2><div><span class="tag" id="sEss"></span> <span class="tag" id="sGer"></span> <button class="btn sm" onclick="toggleCats()">Recolher/Expandir</button></div></div>
    <div id="cats"></div>
    <div class="center" style="margin-top:20px"><button class="btn red sm" onclick="deletar()">🗑 Deletar este personagem</button></div>
  </section>

  <section class="tab glass" id="t-tes">
    <h2>Testes de Perícia</h2>
    <div class="add" style="justify-content:center"><select id="selTeste" style="max-width:260px"></select><input id="modTeste" type="number" value="0" placeholder="Modificador" style="max-width:130px" title="Modificador temporário"></div>
    <div class="center"><button class="btn" style="padding:12px 34px;font-size:15px" onclick="rolarTeste()">Rolar d20</button></div>
    <div class="dado" id="d20">?</div>
    <div class="res" id="resT"></div><div class="det" id="detT"></div>
    <div class="tabela" id="tabT"></div>
  </section>

  <section class="tab glass" id="t-arm">
    <h2>Arsenal</h2>
    <div class="add"><input id="aNome" placeholder="Arma" style="flex:2"><input id="aDano" placeholder="Dano (ex: 2d6+4)"><button class="btn" onclick="addArma()">+ Adicionar</button></div>
    <div id="armas"></div>
    <div id="bandeja"></div><div class="res" id="resD"></div><div class="det" id="detD"></div>
  </section>

  <section class="tab glass" id="t-pod">
    <div class="flex"><h2>Grimório de Poderes</h2><div><button class="btn" onclick="abrirLivro('hab')">📖 Livro de Habilidades</button> <button class="btn" onclick="abrirLivro('rit')">📕 Livro de Rituais</button></div></div><div class="det" id="acesso" style="text-align:left;margin:6px 0 10px"></div>
    <div class="filtros" id="filtros"></div>
    <div class="filtros"><button class="btn sm" onclick="addPoder('Habilidade de Classe')">+ Habilidade</button><button class="btn sm" onclick="addPoder('Multiclasse')">+ Multiclasse</button><button class="btn sm" onclick="addPoder('Ritual')">+ Ritual</button></div>
    <div id="poderes"></div>
  </section>

  <section class="tab glass" id="t-car">
    <h2>Mochila &amp; Carga</h2>
    <div class="carga glass" id="cargaBox">
      <div class="flex"><b id="cargaLbl" style="font-family:var(--mono);color:var(--a)">Carga: 0 / 0</b>
      <select id="selMoch" style="width:auto" onchange="campo('mochila',+this.value);calcCarga()">
        <option value="1">Sem Mochila (×1)</option><option value="2">Mochila Normal (×2)</option><option value="3">Mochila Tática (×3)</option></select></div>
      <div class="bar"><i id="cargaBar" style="background:var(--a)"></i></div>
      <div class="det" id="cargaInfo"></div>
    </div>
    <div id="itens"></div>
    <button class="btn" style="width:100%" onclick="addItem()">+ Adicionar item</button>
  </section>
</div></main>
<button class="btn fab" onclick="abrirNotas()" title="Anotações" aria-label="Anotações">✏️</button>
</div>

<div class="modal" id="mCfg" onclick="if(event.target===this)modal('mCfg',0)"><div class="box glass">
  <h2>Configurações</h2>
  <div class="tem" id="temas"></div>
  <label class="det" style="text-align:left">Escala da interface: <b id="escLbl"></b></label>
  <input type="range" id="esc" min="80" max="130" step="5" oninput="setEscala(+this.value)">
  <div class="det" id="infoArm" style="text-align:left;margin-top:16px"></div>
  <div class="marc" style="margin-top:8px"><button class="btn sm" onclick="exportar()">⬇ Exportar backup</button><button class="btn sm" onclick="$('inBk').click()">⬆ Importar backup</button><input type="file" id="inBk" accept=".json,application/json" hidden onchange="importar(this)"></div>
  <div class="center" style="margin-top:16px"><button class="btn" onclick="modal('mCfg',0)">Fechar</button></div>
</div></div>
<div class="modal" id="mNotas" style="z-index:60" onclick="if(event.target===this)modal('mNotas',0)"><div class="box nbox glass">
  <div class="flex" style="margin-bottom:10px"><h2 style="margin:0">Anotações</h2><div class="marc" id="nAbas" style="margin:0"><button class="btn sm on" data-a="esc" onclick="notaModo('esc')">✎ Escrever</button><button class="btn sm" data-a="des" onclick="notaModo('des')">🖌 Desenhar</button></div></div>
  <div class="marc" id="nTools" style="display:none"></div>
  <div class="nstage" id="nStage"><textarea id="nTxt" placeholder="Escreva aqui e, se quiser, desenhe por cima (modo Desenhar)..." oninput="nPag().t=this.value;salvar()"></textarea><canvas id="nCv" width="900" height="560"></canvas></div>
  <div class="flex" style="margin-top:12px"><span><button class="btn sm" onclick="irPag(np-1)">◀</button> <select id="nSel" style="width:auto;max-width:150px;display:inline-block" onchange="irPag(+this.value)"></select> <button class="btn sm" onclick="irPag(np+1)">▶</button></span><span><button class="btn sm" onclick="addPag()">+ Página</button> <button class="btn red sm" onclick="delPag()">🗑 Página</button> <button class="btn sm" onclick="modal('mNotas',0)">Fechar</button></span></div>
</div></div>
<div class="modal" id="mAsk" style="z-index:80" onclick="if(event.target===this)askFim(null)"><div class="box glass"><p id="askMsg" style="margin:0 0 12px"></p><input id="askIn" onkeydown="if(event.key==='Enter')askFim(true)"><div class="flex" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="askFim(null)">Cancelar</button><button class="btn red" id="askOk" onclick="askFim(true)">Confirmar</button></div></div></div>
<div class="modal" id="mLivro" onclick="if(event.target===this)modal('mLivro',0)"><div class="box bkbox glass">

."},{"n":"Sobrecarga de Utilidade","t":"Gastando 3 PE, você força um de seus itens consumíveis (como um kit médico ou ferramenta) a realizar um efeito dobrado, mas o item se torna inútil após esse uso."}],"Espírita":[{"n":"Resiliente","t":"Ao Passar no teste de constituição para evitar dano de sanidade de um monstro, você não toma o dano de crença Ao usar o seu primeiro ritual"},{"n":"Idealizar os Espíritos","t":"você pode rodar um teste de Espiritismo ao lugar de investigação ou percepção, para investigar pistas paranormais ou obter informações"},{"n":"Ritual Predileto","t":"Você pode escolher o seu ritual favorito, ele custa -2 PE e diminui o dano de crença em 2 para executar. Pode mudar o ritual a cada interlúdio ou cena de descanso."},{"n":"Camuflagem Espiritual","t":"Você usa os espíritos como cosmético e pode alterar alguma característica sua. Por padrão, recebe +4 em persuasão e lábia."},{"n":"Inibir","t":"Escolha um elemento, você recebe 4 de redução de dano para esse elemento"},{"n":"Identificando o oculto","t":"gastando 2 PE Você pode usar um teste de Espiritismo para entender o que é o monstro, objetos ou símbolos espirituais"},{"n":"Mão Astral","t":"Sempre que quiser facilitar um teste, pode gastar 2 PE para rodar dois dados de facilitar ao invés de um"},{"n":"Ritual Potente","t":"Você consegue extrair o máximo do ritual, Gastando 3 PE você pode dobrar a quantidade de cura ou adicionar um bônus de +2d8 no dano de um ritual"},{"n":"Lutar por Crença","t":"Sempre que algum dos seus companheiros tomar dano de crença, você pode por 1 PE tomar metade do dano, reduzindo pela metade também o dano que seu companheiro receberia."},{"n":"Proficiente","t":"Se você amaldiçoou sua arma com algum elemento, você pode usar Espiritismo no lugar de lutar ou pontaria"},{"n":"Canalizar Energia","t":"Use PE para gerar bônus de vida ou sanidade com no máximo 10.\n1 PE = 1 de PV ou SAN"},{"n":"Selo Espiritual","t":"1 vez por missão, você pode gastar 2 PE para ficar resistente a 5 pontos de elementos, sanidade ou crença."},{"n":"Mediunidade","t":"Você consegue ver espíritos em locais. Vantagem em testes de espiritismo para o ambiente."},{"n":"Exorcismo","t":"Caso seja um espírito, você pode exorcizar ele usando testes de espiritismo para tirar o alvo de um objeto ou local. Faça testes de espiritismo contra a constituição do alvo por 1d4+1 rodadas. Caso ganhe, recupera 2 de crença por nível, caso perca perde 2 de PE por nível."},{"n":"Elo Espiritual","t":"Você pode gastar 3 PE para compartilhar sua visão com um espírito aliado, permitindo enxergar através de paredes finas por 1d4 rodadas."},{"n":"Proteção Espectral","t":"Gastando 3 PE, você cria um círculo de 3m ao seu redor que dá 4 de DR de resistência a dano elemental para aliados próximos."},{"n":"Guia das Almas","t":"Gastando 2 PE, você convoca um rastro espiritual que concede vantagem em testes de Sobrevivência para todo o grupo não se perder em locais amaldiçoados."},{"n":"Vigor Espiritual","t":"Em cenas de fuga ou correria, você gasta 2 PE para ter vantagem na cena toda em teste de agilidade e atletismo."},{"n":"Âncora Física","t":"Você gasta 2 PE para fixar um aliado ao chão espiritual, tornando-o imune a efeitos de empurrão ou de ser derrubado."},{"n":"Impacto Espiritual","t":"Gastando 2 PE, você canaliza energia para suas mãos, fazendo com que seu próximo ataque desarmado ou com arma de impacto cause +1d8 de dano físico."},{"n":"Arremesso Condutor","t":"Ao atacar a distância, você pode gastar 2 PE para guiá-la fisicamente, ignorando qualquer bônus de Defesa por cobertura leve do alvo."},{"n":"Golpe Expulsivo","t":"Ao acertar um ataque físico, gaste 3 PE para forçar o alvo a um teste de Força; se falhar, ele é empurrado 4,5m e fica Caído."},{"n":"Lâmina de Inércia","t":"Você gasta 2 PE para fazer com que a arma de um aliado ignore qualquer resistência a dano de corte ou impacto por uma cena."},{"n":"Sentir o Oculto","t":"Você recebe vantagem em testes de Percepção para localizar passagens secretas ou compartimentos escondidos por meios paranormais."},{"n":"Transe Mediúnico","t":"Você gasta 3 PE para entrar em um estado de concentração profunda por 1 rodada; na rodada seguinte, você pode usar sua perícia de Espiritismo no lugar de qualquer teste de Investigação ou Intuição."}],"Sobrevivente":[{"n":"Regra da Classe","t":"Você sabe fazer o item tático “Armadilha” por 3 PE. Aprender novas armadilhas mexem diretamente com sua classe. Armadilhas e itens que combinem com elas pesam 0 para você.","nota":1},{"n":"Sempre Alerta","t":"Em uma cena, você pode gastar 2 de PE para sentir a área. Fazendo isso, você ganha +2 em iniciativa se ocorrer o combate e pode alertar 1 personagem para dar vantagem no teste de iniciativa."},{"n":"Improvisar","t":"Você pode usar ataduras, tecidos ou panos pra curar 1d4. Em ambiente hostil, a cura aumenta para 1d6+1."},{"n":"Trilha Certa","t":"Ao achar uma pista em uma cena de investigação, você pode executar um teste seguido com +3 no atributo de \"Investigação\" para procurar uma próxima pista."},{"n":"Instinto de Sobrevivência","t":"Uma vez por cena, evite automaticamente uma armadilha ou emboscada."},{"n":"Adaptação Rápida","t":"Ganha +2 em testes de habilidades quando em ambientes hostis (floresta, ruína, deserto)."},{"n":"Autossuficiência","t":"Seus descansos ruins e curtos tem classificação normal"},{"n":"Adaptação Brutal","t":"Se você sofrer dano por uma fonte natural, ganha +1 em testes de uma árvore a sua escolha até o fim da cena."},{"n":"Reflexos de Puro Instinto","t":"Recebe +2 em Iniciativa se estiver sozinho ou à frente do grupo."},{"n":"Sobrevivente Precavido","t":"Você consegue fazer armadilhas que rastreiam e que causam uma condição que você tenha acesso."},{"n":"Instinto de Caçador","t":"Pode rastrear criaturas ou pessoas com testes de sobrevivência. Tem vantagem em ambiente hostil."},{"n":"Recuperação Rápida","t":"regenera +1d4 do atributo a sua escolha em descansos ruins/curtos"},{"n":"Sentido de Perigo","t":"Ao entrar em uma sala nova, você pode gastar 2 PE para fazer um teste de Percepção com vantagem. Se passar, o mestre deve revelar se há ameaças imediatas escondidas."},{"n":"Remendo de Campo","t":"Se um item de um aliado quebrar (exceto eletrônicos complexos), você pode gastar 2 PE para fazer um conserto temporário que dura até o fim da cena."},{"n":"Camuflagem Natural","t":"Em ambientes externos, você pode gastar 2 PE por turno que usar para dar desvantagem em tiros mirados em você."},{"n":"Proficiente em emboscadas","t":"Você tem vantagem para detectar e desarmar armadilhas mecânicas. Além disso, pode gastar 3 PE para \"reaproveitar\" uma armadilha inimiga desarmada contra eles."},{"n":"Uso Eficiente","t":"Você não recebe as desvantagens de estar com sobrecarga de peso ao lotar seus slots."},{"n":"Vontade de Viver","t":"Quando estiver com menos de 15 PV, você recebe +2 em todos os testes de Esquiva e Vantagem em testes de Constituição."},{"n":"Mortalidade Ambulante","t":"Você recebe proficiência em armas improvisadas e em armas de condições adversas. Tira a desvantagem de atacar com armas improvisadas e aumenta em +1d6 o dano com essas armas."},{"n":"Simular Morte","t":"Como uma reação ao sofrer dano, você pode gastar 3 PE para entrar em um estado catatônico; inimigos devem passar em um teste de Percepção (DT Extrema) para notar que você ainda está vivo. O alvo fica vulnerável ao seu próximo ataque."},{"n":"Armadilha de Combate","t":"Como uma ação principal e 3 PE, você prepara o chão ao seu redor; o próximo inimigo que se mover até você deve passar em Destreza ou ficará Preso e sofrerá 2d6 de dano."},{"n":"Perfeitamente Calculado","t":"Você sempre está calculando possibilidades, permitindo que você sempre ignore a primeira condição mental da cena. Além disso, em combate você pode sempre por 2 PE sempre que um inimigo sair do seu alcance diminuir a defesa dele em 2 para o próximo turno."},{"n":"Aproveitamento Total","t":"Você consegue extrair o dobro de utilidade de itens consumíveis; um kit médico de 3 usos passa a ter 6 usos em suas mãos."},{"n":"Mestre da Improvisação","t":"Gastando 2 PE, você pode usar qualquer objeto comum como se fosse uma ferramenta de perícia específica (ex: usar um prego como gazua) sem sofrer penalidades."},{"n":"Leitura de Terreno","t":"Ao iniciar um combate em ambiente natural ou urbano hostil, você identifica os melhores pontos de cobertura, concedendo +2 de Defesa para um aliado adjacente. Gaste 4 PE para isso."},{"n":"Caçada Perfeita","t":"Você ganha +1d6 de dano contra alvos rastreados."}],"Altruísta":[{"n":"Regra da Classe","t":"O modificador de altruísta se relaciona diretamente com a sua perícia de maior ligação. Sua habilidade geral característica. EX: 5 Pontos em Terapia fazem seu modificador ir para 1. 10 pontos no seu modificador faz ir para 2. 15 pontos faz ir para 3.","nota":1},{"n":"Técnicas Médicas","t":"Sempre que você curar um personagem, você pode curar +1d4 seu"},{"n":"Psicólogo Cotidiano","t":"Em cenas de interlúdio, você pode gastar sua ação e 3 PE para tratar a sanidade e a crença de um dos seus aliados podendo rodar 1d6 + seu modificador de altruísta. O segundo atributo escolhido recupera metade do que foi curado (arredondado pra cima nesse caso)."},{"n":"Sacrifício Breve","t":"Redirecione metade do dano que um aliado receberia para você (como reação). 3 PE"},{"n":"Luz Restauradora","t":"Gaste sua ação para remover uma condição (ex: medo, cego, sangrando) de um aliado. Custa 3 PE"},{"n":"Vontade Inquebrável","t":"Quando um aliado falha em um teste de Sanidade, você pode inspirá-lo a rerrolar, gastando 1 PE."},{"n":"Inspiração Contagiante","t":"Quando você recupera de fontes artificiais (Kits e Medicamentos), aliados adjacentes recuperam 2 pontos de PE também (uma vez por rodada)."},{"n":"Palavras de Consolo","t":"restaura o dobro do que restauraria da sanidade de um companheiro com um teste de Terapia."},{"n":"Luz No Fim do Túnel","t":"Gastando 2 PE você pode escolher um aliado para receber 1d6 temporário de algum atributo. Dura a Cena."},{"n":"Aura Protetora","t":"No início de um combate, você proclama um aliado próximo que ganha vantagem contra a perda de sanidade."},{"n":"Motivação","t":"Caso um aliado esteja com pontos de vida zerados, o jogador pode gastar sua ação principal para fazer um discurso e motivar ele a continuar vivo, garantindo que ele não falhe no próximo teste de Constituição."},{"n":"Luz da Esperança","t":"uma vez por sessão, você pode gastar 3 PE para recuperar o igual a um descanso ruim."},{"n":"Autoproteção","t":"Aumenta o dado das armas de fogo em uma categoria. Caso já esteja no máximo (1d12). Você ganha 2 de Perfuração na arma."},{"n":"Chama da Justiça","t":"4 PE + Reação para após um aliado adjacente sofrer dano você pode fazer um ataque imediato causando +1D de dano."},{"n":"Urgência e Emergência","t":"Ao preço de 4 PE, sua cura de fontes artificiais tem o valor maximizado"},{"n":"Voz do Comando","t":"Gastando 3 PE e uma ação, você permite que um aliado realize imediatamente uma ação de movimento ou um ataque simples fora do turno dele. Ele age no seu lugar."},{"n":"Sincronia de Grupo","t":"Gastando 4 PE, você e todos os aliados adjacentes recebem +1 em todos os testes de perícia por 3 rodadas."},{"n":"Reação em Cadeia","t":"Sempre que um aliado acertar um crítico, você pode gastar 2 PE para realizar um movimento extra ou trocar de arma imediatamente."},{"n":"Golpe da Redenção","t":"Se você atacar um inimigo que causou dano a um aliado na rodada anterior, você pode gastar 3 PE para causar +2d6 de dano adicional."},{"n":"Impacto da Esperança","t":"Gastando 4 PE, após um aliado ser atacado, você no seu ataque pode ignorar as armaduras do inimigo."},{"n":"Recuperação em Grupo","t":"Uma vez por sessão, você pode gastar 5 PE para fazer com que todos os aliados em alcance curto recuperem 2 PE cada"},{"n":"Sacrifício de Energia","t":"Você pode escolher perder 1d6 de Sanidade para restaurar a mesma quantidade em PE ou Crença para um companheiro."},{"n":"Sincronismo","t":"Você marca um aliado, o primeiro dano que ele levar é transferido pra você, reduza o seu modificador"},{"n":"Incentivo Vital","t":"Como uma ação bônus, você gasta 2 PE para conceder 1d10 de PV + modificador temporários a um aliado que possa te ouvir."},{"n":"Presença Confortante","t":"Durante um descanso curto, você gasta 10 PE para garantir que todos os aliados recuperem o valor máximo dos dados de cura em 2 atributos escolhido por você"},{"n":"Transferência de Vigor","t":"Você gasta 3 PE para permitir que um aliado realize um teste de resistência que ele acabou de falhar, com vantagem."}],"Multiclasse":[{"n":"Vingança","t":"Depois de tomar um acerto crítico você pode gastar 4 PE e uma ação completa para revidar o ataque com sua arma e empurrar o inimigo para 3 metros, se bater em uma parede é +1d6"},{"n":"Expertise","t":"Pode rolar um dado novamente pelo preço de 2 PE"},{"n":"A Melhor defesa é o ataque","t":"No Começo de uma cena de ação, você pode usar 2 PE pra ganhar mais uma ação adicional"},{"n":"Mira de Elite","t":"Gastando 2 PE, seu usuário pode mirar e atirar no mesmo turno, causando mais 1 dado de dano."},{"n":"Atirador de Elite","t":"Quando o usuário mira ele tem mais um dano de dano se tirar crítico."},{"n":"Retomar o Fôlego","t":"Uma vez por cena, você pode gastar 2 PE para recuperar 1d4 de vida ou 1d4 de Sanidade."},{"n":"Reação Instintiva","t":"Ao ser atacado pela primeira vez, você pode gastar 1 PE para rolar um teste de Destreza ou Constituição. Se passar (DT igual ao ataque), reduz o dano pela metade."},{"n":"Expansão de Conhecimento","t":"Caso você escolha não upar PE quando iluminar você pode escolher uma habilidade de qualquer classe ao invés da sua."},{"n":"Proficiência Aleatória","t":"Você ganha proficiência em armas improvisadas e escolhe uma categoria de arma para ter proficiência também."},{"n":"Aplicação Rápida","t":"Gaste 1 PE para aplicar veneno em uma arma como ação livre."},{"n":"Combater com Duas Armas","t":"Se estiver usando duas armas (e pelo menos uma delas não é complexa), você pode rodar o ataque para ambas as armas, ou seja, dois ataques. Um com cada arma, se optar por fazer isso, o segundo ataque tem desvantagem no teste. O alvo não pode escolher contra atacar o segundo ataque.\nPré-Requisito: Força ou Destreza 16"},{"n":"Punhos Cerrados","t":"Seus ataques desarmados causam 1d6 pontos de dano ao invés de 1d4, eles contam como armas ágeis. A cada iluminação você pode ao preço de não upar PE aumentar para 1d8, 1d10 até 1d12 de dano."},{"n":"Resistência Adaptativa","t":"(Pré-requisito: Espiritismo 16). Sempre que sofrer dano de um elemento específico (como Desespero), você pode gastar 2 PE para ganhar resistência 5 contra esse elemento até o fim da cena."},{"n":"Veneno Rápido","t":"Você aprende a criar venenos simples. Gastando 2 PE, seu próximo ataque causa a condição \"Envenenado\" (1d4 de dano por turno) por 3 rodadas."},{"n":"Resiliência Mental","t":"Gastando 2 PE, você pode usar seu atributo de maior valor para resistir a um efeito de medo ou pânico."},{"n":"Vigor Renovado","t":"Ao final de um combate, se você não caiu, recupera 2 PE automaticamente."},{"n":"Fôlego de Combate","t":"Ao eliminar um inimigo, você recupera 1d4 de PV ou PE (você escolhe) sem custo adicional."},{"n":"Sincronia Tática","t":"Quando você usa a ação \"Ajudar\", o aliado recebe +1d4 para somar ao teste além da vantagem, ao custo de 2 PE."},{"n":"Resiliência Híbrida","t":"Gastando 3 PE, você escolhe uma condição negativa que está sofrendo e reduz a duração dela em 1 rodada."},{"n":"Troca de Postura","t":"Você pode gastar 2 PE para reposicionar e ficar adjacente ao alvo em alcance médio. 4 PE para ficar longo."},{"n":"Adaptação de Combate","t":"Uma vez por cena, ao errar um ataque, você pode gastar 2 PE para realizar um movimento extra ou trocar seu equipamento sem gastar ações."},{"n":"Equilíbrio de Funções","t":"Se você não usou nenhuma habilidade de classe na rodada anterior, sua próxima habilidade custa 1 PE a menos (máximo 2)."},{"n":"Sincronia Energética","t":"Sempre que você recuperar PE através de um descanso ou habilidade, você pode escolher um aliado para recuperar 1d4 PE também, sem custo adicional."},{"n":"Adaptação de Fluxo","t":"Sempre que você utilizar uma habilidade de uma classe que consome 3 PE ou mais, a próxima habilidade que você usar terá seu custo reduzido em 1 PE (mínimo 1) até o fim do seu próximo turno."},{"n":"Prontidão Tática","t":"Uma vez por cena, você pode trocar sua Reação já usada por uma nova, recuperando-a por 3 PE."}]},"rit":[{"n":"Regras dos Rituais","t":"Rituais são a expressão dos espíritos, paranormal e tudo que é impossível.\nQuando Iluminar você pode escolher não upar sua crença e pegar um ritual a sua escolha.\nTal regra muda quando:\n1.  Um espírita Ilumina, caso escolha um ritual, você apenas evolui 1d8 de crença ao invés de 2d8.\n2.  Iluminar com um item que possui ritual. Quando isso ocorrer, você não recupera 100% do atributo de crença ao preço de aprendê-lo.\n3.  Escolher um ritual de um elemento/força regente que você possui emparelhamento.","nota":1},{"n":"Absorção Espiritual","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Cena","Custo":"4 PE | 1d6+3 de Crença"},"t":"Os Espíritos ao seu redor doam um pouco de sua força para o conjurador recebendo +15 de PV.\nExtra (+1 PE): Pode usar como reação\nDiscente (+3 PE) Pode ao toque passar esse PV com um bônus de +1d8 para um aliado"},{"n":"Amaldiçoar com Elemento","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 arma","Duração":"Cena","Custo":"3 PE | 1d6+2 de Crença"},"t":"A arma fica com manchas variando a cor de acordo com o elemento e exalar uma ar de mistério passando a causar +2d6 do elemento escolhido\nDiscente(+3 PE): causa 3d6 + diminui o crítico da arma em 1\nVerdadeiro: (+5) passa todo o dano para o elemento escolhido","m":1},{"n":"Anular o Eminente","c":{"Execução":"Reação","Alcance":"Pessoal","Alvo":"Você","Duração":"Na rodada","Custo":"3 PE | 1d6+1 de Crença"},"t":"Ao levar um ataque, você pode usar a reação para usar este ritual. Você pode adiar o dano levado para a próxima rodada. Uma vez que use o ritual novamente,seguido, o custo aumenta em +2 de crença"},{"n":"Aprimorar Sangue","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 arma","Duração":"Cena","Custo":"3 PE | 1d4+2 de Crença"},"t":"A arma fica com manchas de sangue e exalar uma arma sanguinária passando a causar +3d4 de Visceral\nDiscente(+3 PE): causa +1d4 e da 1d6 de sangramento","m":1},{"n":"Ataque da Incerteza","c":{"Execução":"Padrão","Alvo":"você","Alcance":"pessoal","Duração":"1 Turno","Custo":"4 PE | 1d8+2 de Crença"},"t":"Ao usar a ação de atacar (corpo a corpo) após ativar esse ritual, você roda 1d4 para decidir qual destes efeitos seu atacar terá:\n1- seu número de crítico diminui 2\n2- +1 de multiplicador de crítico\n3- pode atacar uma segunda vez se tirar extremo\n4- da +2d8 de dano fantasmagórico"},{"n":"Coincidir Caminhos","c":{"Execução":"Padrão","Alvo":"1 ser","Alcance":"curto","Duração":"cena","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você manipula os espíritos da sorte para deixar 1 ser com o caminho do escolhido, concede a este +2 em habilidades gerais\nDiscente (+4 PE): muda o alcance para \"Aliados\"","m":1},{"n":"Couraça da Exasperação","c":{"Execução":"Padrão","Alvo":"Você","Duração":"Cena","Custo":"5 PE | 2d4+3 de Crença"},"t":"Você força seu desespero a assumir a forma física e crescer como se fosse uma armadura. Toda vez que um dano físico (impacto, corte e balístico) Você pode gastar a sua reação para curar 2d6+2 de PV"},{"n":"Desenganado","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"Criatura Escolhida","Duração":"Sustentada","Resistência":"Constituição","Custo":"4 PE | 1d4+2 de Crença"},"t":"Você manifesta pequenas mãos de espíritos próximos no corpo do alvo, que tem dificuldade em seus movimentos, tendo dificuldade em seus movimentos e em acertar ataques -2 pontos em força e destreza.","m":1},{"n":"Dilacerar Carne","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Arma Pesada de Ponta","Custo":"3 PE | 1d6+2 de Crença"},"t":"Você canaliza sua raiva interna em seus ataques, mesmo quando um ataque não acertam em cheio, ele machuca muito. Para todo resultado 1 em dados de dano com a arma, você recebe 1d6 de dano visceral adicional\nDiscente (+3 PE) todo o resultado 1 e 2 conta","m":1},{"n":"Esfera do Contrário","c":{"Execução":"Padrão","Alcance":"Curto","Duração":"Instantânea","Custo":"6 PE | 1d8+2 de Crença"},"t":"Você cria um orbe de sentimentos negativos e ruins de sua afinidade com desespero, que se manifesta em uma esfera roxa que pulsa e reprimi a positividade do conjurador.\nLançar o Orbe: O jogador pode lançar o orbe causando 3d8 de dano\nBom no teste de constituição da metade dano.\nDoar Orbe: Pode dar o orbe para outro jogador que pode lançar ele causando 4d8.\nO orbe pode ser lançado em até 2 rodadas, se não for vai explodir e curar 1d6 do conjurador ou de algum ser do elemento desespero"},{"n":"Ferver Sangue","c":{"Execução":"padrão","Alcance":"Curto","Alvo":"Uma criatura","Duração":"Sustentação","Resistência":"Preparação","Custo":"5 PE | 1d4+2 de Crença"},"t":"O Sangue do alvo aquece rapidamente até entrar em ebulição. Quando o ritual é conjurado o alvo deve fazer um teste de preparação e se falhar toma 3d8 de dano de visceral e fica fraco; se passar, sofre metade do dano e não fica fraco. Se o alvo passar dois testes seguidos o efeito acaba."},{"n":"Flanco Obscuro","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Ser","Duração":"Instantânea","Resistência":"Constituição reduz Metade","Custo":"3 PE | 1d6+2 de Crença"},"t":"Você se aproveita das costas sem defesa dos alvos para chamar uma sombra vinda da escuridão para desferir um golpe com toda a violência do elemento escuridão. O Alvo recebe 3d6+2 de dano de Escuridão e recebe a condição fraco por 1d3 rodadas\nDiscente(+6 PE): muda o dano para 6d6+4 e causa 1d6 de rodadas em fraqueza"},{"n":"Físico Aprimorado","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1","Duração":"Cena","Custo":"3 PE | 1d4+1 de Crença"},"t":"O Alvo Tem seus músculos preparados e ligamentos reforçados, recebendo vantagem em destreza, força, atletismo à sua escolha\nObscuro (+3 PE): em vez do normal o alvo recebe além da vantagem +1 ponto no atributo escolhido\n(1) GRITOS:\nDuração: 1 turno\nAlcance: 1 alvo\nResistência: Preparação\nCusto: 4 PE | 1d4+2 de Crença\nVocê pode fazer a vítima começar a ouvir gritos altíssimos de dezenas de pessoas bem no fundo de suas orelhas e deixar o alvo desesperado.\n2d8 de Desespero e Desvantagem em qualquer teste que ele tentar fazer por 1d4 rodadas."},{"n":"Hemorragia","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Criatura","Duração":"Na Hora","Resistência":"Preparação reduz metade","Custo":"5 PE | 1d6+4 de Crença"},"t":"Você faz com que o sangue do alvo seja arrancado do seu corpo através de sua pele, causando 3d6 de Visceral. Você absorve esse sangue recuperando seus pontos de vida iguais a metade do dano causado\nObscuro (+2 PE): Cura outra pessoa com esse efeito ao toque e aumenta para 5d6\nTotal(+6 PE) tira a resistência para nenhuma e pode atacar com uma arma para executar o ritual, Se acertar causa o dano do ataque e do ritual, recuperando os pontos de vida em quatidade igual à metade do dano total causado."},{"n":"Impulso Espiritual","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Cena","Custo":"3 PE | 1d6+2 de Crença"},"t":"Você melhora a sua agilidade para algo paranormal, permitindo que ande e corra mais rápido, ganhando +3 em testes de Agilidade e Atletismo e podendo fazer manobras como ação livre","m":1},{"n":"Inferir passado","c":{"Execução":"Padrão","Alvo":"1 ser","Alcance":"Curto","Duração":"batalha","Custo":"4 PE | 1d10 de Crença"},"t":"Ao tocar no alvo que você quer, você manipula o tempo dele atrasando suas ações. Mecanicamente, ele joga 1 turno atrasado e fica lento por uma rodada.\nDiscente (+2 PE) Muda para 2 turnos"},{"n":"Intenção Mascarada","c":{"Execução":"Padrão","Alvo":"2 objetos","Alcance":"Toque","Duração":"Descarregar","Custo":"5 PE | 1d6+3 de Crença"},"t":"Você marca dois itens com um símbolo a seu gosto. Ao segurar um desses itens e Descarregar esse símbolo, você fica carregado de incertezas, fazendo com que quem esteja tentando te atacar fiquem confusos. Você recebe +4 de defesa e 4 de bloqueio e os alvos tem que rodar Espiritismo para poder te atacar, tem desvantagem no dado."},{"n":"Mental","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"Um","Duração":"Instantânea","Resistência":"Constituição","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você Manifesta e dispara uma onda quase invisível aos olhos que entra no alvo e que ao entrar em contato com o alvo dá 3d6 de fantasmagórico e deixa a pessoa vulnerável no próximo turno. Se o inimigo passar no teste de constituição, sofre apenas metade do dano e evitar a vulnerabilidade, se usado em um monstro que tem fraqueza a fantasmagórico dá +1d\nDiscente (+4 PE): Muda o Alvo para dois e que dá 4d6+6 de dano fantasmagórico nas duas criaturas","m":1},{"n":"Nutrição Espiritual","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"Seres Escolhidos","Duração":"Instantânea","Custo":"6 PE | 1d8+4 de Crença"},"t":"Você Cria 3 Fagulhas juntando a força dos espíritos ao redor que complementam e fecham as feridas do corpo do alvo, cada fagulha recupera, individualmente, 1d6+1 de PV do alvo, você pode distribuir como quiser entre os seres dentro do alcance\nDiscente (+3 PE): Aumenta para 6 pessoas e a recuperação para 1d8+1"},{"n":"Junção Mental","c":{"Execução":"Padrão","Alcance":"Toque","Duração":"Cena","Custo":"2 PE | 1d4+2 de Crença"},"t":"Você precisa desenhar 2 símbolos, um para quem irá realizar o ritual e outro para o alvo e marcar ele, após isso haverá uma Junção de mentes onde o que o outro quiser falar, pode falar \"telepaticamente\" com o outro\nDiscente: (+3 PE): Pode colocar até 5 pessoas na ligação mental","m":1},{"n":"Nuvem de Sombras","c":{"Execução":"Padrão","Efeito":"uma pequena neblina/nuvem que é criada tendo 4 metros de altura e 5 metros de raio","Duração":"Cena","Custo":": 4 PE | 1d6+2 de Crença"},"t":"Uma Nuvem de pura escuridão, imitando fuligem escurecendo ainda mais a visão, seres em 1,5m tem camuflagem parcial (+3 no teste de furtividade) e em 3m tem Camuflagem total (+6 no teste de furtividade)\nDiscente(+3 PE): Você pode escolher quem enxerga através do ritual\nVerdadeiro:??","m":1},{"n":"Reescrever a Vida","c":{"Execução":"Padrão","Alcance":"Toque","Duração":"Instantânea","Custo":"5 PE | 1d8+3 de Crença"},"t":"Você chama os espíritos bondosos ao redor de você para curar uma ferida de um companheiro, você cura 2d8+2 de PV mas toma metade desse valor em dano de Sanidade\nDiscente (+4 PE): Aumenta para 4d8+5 a Cura","m":1},{"n":"Aprisionar Espíritos","c":{"Custo":"4 PE | 1d6+2 de Crença","Execução":"Padrão","Alvo":"Estrutura","Duração":"Instantânea"},"t":"Você suga os Espíritos da localidade que você focar, fazendo um símbolo na porta do local e aprisionando os Espíritos durante aquela cena para evitar ataques. Caso haja espíritos malignos na localidade você consegue se apossar de metade da vida desses espíritos ganhando PV temporário.","m":1},{"n":"Repulsora Elemental","c":{"Execução":"Padrão","Alvo":"Toque","Duração":"Cena","Custo":"3 PE | 1d6+2 de Crença"},"t":"Você pode focar em aniquilar 1 único elemento, fazendo com que a sua arma cause +3d8 de dano ao elemento contrário ao escolhido"},{"n":"Cicatrizar","c":{"Execução":"Padrão","Alvo":"Toque","Duração":"instantânea","Custo":"6 PE | 1d8+3 de Crença"},"t":"Você pode produzir sombra em cima da ferida e com isso usar do que se esconde na escuridão para curar 2d8+2 da pessoa, a Cicatriz ou a ferida é fechada por raízes negras.","m":1},{"n":"Arrancar Pele","c":{"Execução":"Padrão","Alvo":"Um ser","Duração":"Instantânea","Resistência":"Constituição","Custo":"5 PE | 1d6+3 de Crença"},"t":"Um alvo que já foi atacado fica vulnerável a esse ritual. Você utiliza da sua fome de violência para arrancar a pele do alvo causando 2d8+2 de dano visceral, constituição bom reduz metade . O alvo perde a pele de onde você mirou e caso tire fracasso no teste fica com hemorragia (1d10 de dano de sangramento até tirar 2 sucessos em constituição)","m":1},{"n":"Ruir na Escuridão","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Ser","Duração":"Instantânea","Resistência":"Constituição reduz metade","Custo":"4 PE | 1d6+3 de Crença"},"t":"Você se concentra usando sua ação de movimento para chamar os espíritos da Escuridão para degradarem o alvo causando 2d8+4 de Escuridão\nDiscente(+5 PE): Muda a Resistência para \"Nenhuma\" e o dano para 3d8+6. Como parte da execução, você transfere os espíritos para a sua arma e faz um ataque corpo a corpo com a arma. Se acertar, causa o dano da arma e do ritual, somados","m":1},{"n":"Sangramento Aprimorado","c":{"Execução":"Padrão","Alvo":"Sua Arma ou de um aliado","Duração":"Cena","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você crava seu sangue na sua lâmina fazendo o efeito de Sangramento aumentar ou surgir na lâmina. Esta, fica mais afiada e com camadas vermelhas causando mais dano do que deveria. Mecanicamente, para cada turno atacado com esta lâmina, o Sangramento aumenta em 1d2","m":1},{"n":"Selvageria Escura","c":{"Execução":"Padrão","Alvo":"Inimigo","Alcance":"Médio","Duração":"Na hora","Custo":"5 PE | 1d8+3 de Crença"},"t":"Você invoca os espíritos selvagens do abismo da escuridão para desferir um ataque em partes vitais do alvo, os espíritos causa 3d8+4 de dano e deixam o alvo com uma aura Escura que permite que ele não se camufle ou fique furtivo durante 3 turnos"},{"n":"Substituição Astral","c":{"Execução":"Movimento","Alcance":"Médio","Alvo":"você e 1 pessoa","Duração":"Instantânea","Custo":"3 PE | 1d8 de Crença"},"t":"Você atira um feixe de energia com a ponta dos dedos e faz com que você troque de lugar com a primeira pessoa que esse feixe tocar. Caso haja um objeto entre ou o espaço seja pouco entre o alvo, o ritual é dissipado.\nDiscente (+3 PE): muda o alvo para \"Você e um ser\"","m":1},{"n":"Total Escuridão","c":{"Execução":"Padrão","Alvo":"Criatura Escolhida","Alcance":"Alvo","Duração":"Cena","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você manifesta totalmente a escuridão e a manda consumir um alvo com a finalidade de o confundir, dificultando seus movimentos e ações em -2 em rolagens de ataque e -2 de dano. O Alvo deve rolar constituição para evitar o efeito. DT BOM\nDiscente (+3): Aumenta a DT para Extremo e +1 em cada penalidade","m":1},{"n":"Doar Escuridão","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Acessório, arma de fogo ou vestimenta","Duração":"Cena","Custo":"3 PE | 4 fixo de Crença"},"t":"Você concede um pouco da escuridão dentro de você sacrificando 4 de crença e 1 ponto de vida para fazer um acessório; vestimenta ou arma funcionar de uma maneira diferente. Fornecendo +2 em testes normais que se amaldiçoa uma vestimenta e em uma arma +2 em testes de ataque\nObscuro (+4 PE): O bônus aumenta em +2\n(1)Prender no Tempo:\nDuração: 2 Turnos\nAlcance: 1 alvo\nResistência: Constituição\nCusto: 6 PE | 1d6+2 de Crença\nTocando no alvo e marcando o alvo com algo (Tinta, sangue, etc), você pode tirar a reação do alvo por 2 turnos (Esquiva, Bloquear ou contra-atacar). Caso o alvo tire bom ou extremo, ele fica apenas um turno sem reação"},{"n":"Língua dos Mortos","c":{"Execução":"Ritualístico (5 minutos)","Alcance":"Toque (cadáver ou item do falecido)","Duração":"1 minuto","Custo":"2 PE | 1d6+2 de Crença"},"t":"Você pode fazer até 3 perguntas para um espírito preso a um corpo ou objeto. As respostas são curtas e limitadas pela lucidez do espírito. O mestre pode impor consequências se o ritual for abusado, como atrair espíritos hostis."},{"n":"Revelação Sombria","c":{"Execução":"Instantânea","Alcance":"10 metros","Duração":"Cena","Custo":"2 PE | 1d6+2 de Crença"},"t":"Você revela tudo que foi escondido magicamente, incluindo ilusão, camuflagem sobrenatural ou pistas ocultas. Teste de Percepção com vantagem para rastrear pistas no local por 1 cena.","m":1},{"n":"Rastro de Sangue","c":{"Execução":"Padrão","Alcance":"Curto","Duração":"Sustesntação","Custo":"2 PE| 1d6+2 de Crença"},"t":"Permite seguir um rastro físico (sangue, pegadas, impressões) mesmo que esteja invisível ou tenha sido parcialmente apagado. Você vê o caminho por onde a vítima ou criatura passou até perder o vínculo espiritual.","m":1},{"n":"Máscara do Outro","c":{"Execução":"Padrão","Alvo":"Você","Duração":"Cena","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você assume temporariamente o comportamento, sotaque ou memória superficial de uma pessoa investigada. Requer um item pessoal da pessoa como foco. Pode enganar familiares ou passar por alguém durante um curto período.","m":1},{"n":"Marcar a Presença","c":{"Execução":"Instantânea","Alvo":"Criatura viva ou espírito","Duração":"1 cena","Custo":"2 PE | 1d6 de Crença"},"t":"Ao tocar um ser, você o \"marca\" com um selo invisível. Por 1 cena, pode rastreá-lo à distância com precisão sobrenatural. Além de saber quando for tocado e moldado espiritualmente."},{"n":"Análise Espiritual Forense","c":{"Execução":"Padrão","Alcance":"Toque (cadáver ou vestígio)","Custo":"1 PE | 1d4+1 de Crença","Efeito":""},"t":"Você realiza uma análise detalhada de um corpo ou marca paranormal.\nRevela:\nCausa da morte ou efeito mágico\nElemento ou entidade envolvida\nSe houve resistência espiritual","m":1},{"n":"Foco de Energias","c":{"Execução":"Rápida","Alvo":"Objeto investigado","Custo":"2 PE | 1d4+2 de Crença","Efeito":""},"t":"Durante 1 teste de Investigação ou Tecnologia com o objeto, você ganha +2 de bônus.\nSe for um objeto espiritual ou amaldiçoado pela cena, você sente uma resistência etérea que pode gerar efeitos colaterais se falhar.","m":1},{"n":"Pacto com o Sangue Perdido","c":{"Execução":"Ritualístico","Alvo":"Traço de sangue","Custo":"1d8 de Crença + 1 de Vida"},"t":"Teste: Espiritismo ou Sobrevivência\nEfeito: 3 PE | 1d8 de Crença (+1 PV)\nVocê cria um vínculo sensorial com a pessoa que derramou o sangue. Por 1 cena, você compartilha visões rápidas, sentimentos ou estímulos sensoriais que ela está sentindo. Pode ser usado para rastreamento ou para entender se ela está viva.","m":1},{"n":"Degredo Etéreo","c":{"Execução":"padrão","Alvo":"criatura até médio alcance","Duração":"2 rodadas","Custo":"3 PE | 1d8+2 de Crença"},"t":"Você tenta exilar o alvo para uma zona entre realidades. O alvo faz um teste de resistência (DT BOM). Se falhar, ele desaparece por 1 rodada, retornando confuso (ações com -2). Se passar, sofre 2d8+2 de dano fantasmagórico"},{"n":"Lacre Sombrio","c":{"Execução":"padrão","Alvo":"uma porta, baú ou entrada","Duração":"até ser quebrado","Custo":"3 PE | 1d4+2 de Crença"},"t":"Você conjura uma barreira invisível com selos espectrais que impede a abertura de uma entrada física. A entrada só pode ser aberta com um teste de crime ou espiritismo (DT EXTREMO) ou ao desfazer o ritual. Qualquer tentativa de forçar fisicamente sofre -3.","m":1},{"n":"Tela de Ruído","c":{"Execução":"Padrão","Alvo":"Estrutura","Duração":"Até ser quebrado","Custo":"2 PE | 1d8 de Crença"},"t":"Ao se concentrar em uma estrutura e focalizar sua energia espiritual nesta, você cria uma tela que protege os sons, isto é, que tá de fora não consegue escutar o que estão falando lá dentro, somente vendo as coisas. Quem entrar, o indivíduo que fez o ritual é alertado mas sem saber maiores dados."},{"n":"Ação Desesperada","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"1 Ser","Custo":"5 PE | 1d8+4 de Crença"},"t":"Você concentra toda a energia dos sentimentos em se movimentar mais rápido. Você ganha mais uma ação de movimento por turno.\nDiscente (+5): Você troca por uma ação principal, esta não pode ser usada para conjurar ritual."},{"n":"Desesperar Incógnita","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Criatura","Duração":"Na Hora","Resistência":"Preparação reduz metade","Custo":"4 PE | 1d8+3 de Crença"},"t":"Você faz com que toda a negatividade do alvo seja maximizada e sua existência vire puro desespero, causando 3d6 de Desespero.\nObscuro (+3 PE): Recebe vida temporária = metade do dano causado\nTotal(+7 PE) tira a resistência para nenhuma e pode atacar com uma arma para executar o ritual, Se acertar causa o dano do ataque e do ritual podendo curar crença = metade do dano"},{"n":"Imbuir Facilidade","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Acessório ou Arma","Duração":"Cena","Custo":"3 PE | 1d6+2 de Crença"},"t":"Você pode colocar o item para funcionar de maneira mais eficaz do modo que achar melhor. Pode colocar uma modificação a sua escolha\nDiscente (+2 PE): Muda para duas modificações","m":1},{"n":"Proliferar Negatividade","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"1 Ser","Resistência":"Constituição Parcial","Custo":"4 PE | 1d6+2 de Crença"},"t":"Você lança uma nuvem de negatividade que deixa o alvo fatigado. Se passar no teste só fica vulnerável.\nDiscente (+2 PE): O alvo fica exausto e se passar fica fatigado\nVerdadeiro (+6 PE): Como discente e muda o alvo para até 4 seres - Requer Emparelhamento com Desespero -","m":1},{"n":"Atrapalhar Visualização","c":{"Execução":"Padrão","Alcance":"Pessoal","Duração":"Cena","Custo":"4 PE | 1d6+3 de Crença"},"t":"Você cria 3 cópias ilusórias suas, essas cópias são extremamente realistas. As cópias ficam ao seu redor e imitam suas ações. Você recebe +6 de Defesa. Cada vez que erram um ataque contra você uma imagem desaparece e você perde 2 de defesa.\nDiscente(+3 PE): Aumenta o número de cópias para 5, concedendo 10 de DEF.","m":1},{"n":"Gritos Fantasma","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"1 Ser","Resistência":"Constituição metade","Custo":"4 PE | 1d6+3 de Crença","Efeito":""},"t":"Você vocaliza todas as falas dos espíritos ao seu redor, transformando sua boca numa ferramenta de maldição e feitiço. As falas infectam o seu alvo, causando 4d4+4 de dano fantasmagórico e deixa o alvo ofuscado por uma rodada. Se passar no teste, evita a condição e toma metade do dano.\nDiscente(+3 PE): Muda o alvo para “cone” e aumenta o dano para 6d4+4 e ao invés de ofuscado, o alvo fica cego por uma rodada.\nVerdadeiro(+6 PE): Muda o alvo para “seres escolhidos”, os sons saem diretamente na mente do alvo, aumentando o dano para 10d4+4"},{"n":"Mimese Sombria","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Sustentado (Teste de Espiritismo DT BOM)","Custo":"5 PE | 1d8+3 de Crença","Efeito":""},"t":"Você consegue mimetizar por um período todas as incongruências e falhas da escuridão, seu corpo vira quase que uma união com as sombras presentes no universo. Você recebe as condições de estar em uma cobertura parcial e ignora metade de todos os danos que são de fontes físicas.\nDiscente(+2 PE): Muda a execução para reação, a duração para instantânea. Tais sombras possuem seu corpo tão rápido que você consegue absorver na sua sombra metade do dano que seria causado a você"},{"n":"Visceralizar Outrem","c":{"Execução":"Padrão","Alcance":"curto","Alvo":"1 Ser","Duração":"Instantânea","Resistência":"Constituição Metade","Custo":"6 PE | 1d6+3 de Crença","Efeito":""},"t":"Você coagula uma mistura de líquidos que se tornam vermelho e grotesco. Esse líquido mancha a pele do alvo e causa 4d6 de dano de sangue (constituição metade). Caso o ser não resista, você pode escolher uma perícia essencial para que ele tenha desvantagem pelo resto da cena."},{"n":"Sangria Animal","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Cena","Custo":"5 PE | 1d8+3 de Crença","Efeito":""},"t":"Você desenvolve presas bestiais, que cobrem e reforçam sua arcada dentária. Sua mordida além do 1d6, dá 2d8 e 1d8 de dano visceral.\nDiscente(+4 PE): Os danos mudam para 2d10 + 1d10, o alvo deve realizar um teste de constituição (DT BOM), se falhar fica sangrando"},{"n":"Mitose Energética","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Você","Duração":"1d6+2 turnos","Custo":"5 PE | 1d8+3 de Crença","Efeito":""},"t":"Você usa das últimas forças dos espíritos ao seu redor para se curar, A energia positiva começa a curar você. por 1d6+2 turnos você se cura 1d6+1 pontos de vida. O ritual é dissipado se você se curar totalmente ou entrar em morrendo. Esse ritual só pode ser invocado novamente se ele foi dissipado ou encerrado por quaisquer maneiras. O alvo precisa estar corpo a corpo.\nDiscente(+3 PE): Muda a duração para 6+1d4 Turnos ou até ser dissipada e a recuperação para 1d8+1\nVerdadeiro: ?????"},{"n":"Desesperar Mensagem","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Objeto","Duração":"Até ser desfeito","Custo":"3 PE | 1d4+2 de Crença","Efeito":""},"t":"Você usa um papel, pergaminho, ou quaisquer outro material possíveis de escrita e pode escrever ou transformar o que já está escrito em algo incompressível graças ao desespero, deixando a mensagem ou o que for escrito parecendo palavras horrendas ou algo semelhante a uma carta de despedida. Você escolhe quem pode ler por +1 PE por escolha."},{"n":"Guia do Vazio","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 Objeto","Duração":"Instantânea","Custo":"4 PE | 1d4+3 de Crença","Efeito":""},"t":"Você manifesta 2 corvos (ou animal voador de médio porte de sua preferência). Ao conjurar esse ritual você pode escolher três ações:\nAtacar Contrário: O animal voa em direção a uma criatura em alcance médio e explode numa espécie de lodo que grita e exala o mais puro desespero, o alvo pode esquivar com atletismo (dt extremo), caso passe toma metade do dano, caso não, toma 1d8+2 por entidade\nCapturar: O animal pode agarrar um objeto livre em alcance curto e pode voar por um raio ao redor de você. Cada animal pode carregar 1 espaço, quanto mais carregando, mais espaço pode ser carregado\nEspreitar: Os Animais tem camuflagem (-1 dado para atirar no bicho e de percepção e +1 dado de furtividade) e você pode ver o que os animais enxergam. Por 1 PE você pode trocar a visão para outro animal.\nDiscente(+2 PE): Muda o número de animais para 4."},{"n":"Intracorporar","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 ser","Duração":"Instantânea","Custo":"5 PE | 1d8+4 de Crença","Efeito":""},"t":"Você coagula e transforma o sangue e tripas dentro do alvo em espinhos que perfuram os órgãos internos, Causa 4d6 de dano de Visceral e deixa o alvo sangrando em 1d6 por 1d6 rodadas. Caso o alvo tenha sucesso no teste de constituição (DT EXTREMO), toma metade do dano e evita a condição.\nDiscente(+3 PE): muda o dano para 8d6 de dano de Visceral e coloca o alvo com as condições fraco e sangrando.\nVerdadeiro(+6 PE):????"},{"n":"Desindividualizar","c":{"Execução":"Padrão","Alcance":"curto","Alvo":"1 pessoa","Duração":"Cena","Custo":"5 PE | 1d6+2 de Crença","Efeito":""},"t":"Você invade a mente do alvo e consegue inundar com multíplas informações sussurradas pelos espíritos ao redor que fazem o alvo perder sua capacidade de raciocínio individual, ficando vulnerável e lento. O alvo toma 3d6+2 de dano Fantasmagórico e deve fazer um teste de constituição no final de seus turnos.\nDiscente(+3 PE): ??"},{"n":"Cercar de Sombras","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Instantânea","Custo":"6 PE | 1d8+3 de Crença","Efeito":""},"t":"As sombras ao redor se juntam como uma capa que se arrasta no chão. Seu deslocamento passa a ser de 15 metros e ignora terrenos difíceis, ao passar sobre o aliado, cura 1d8 de vida e ao passar por um inimigo dá 1d8 de dano de Escuridão.\nDiscente(+5 PE): aumenta a cura pra 1d12+4 e o dano para o mesmo. Além de aumentar o deslocamento para 20 metros."},{"n":"Camuflagem","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Cena","Custo":"5 PE | 1d6+3 de Crença","Efeito":""},"t":"Você consegue expor seu sangue para fora do corpo e moldá-lo como uma camuflagem corpórea. Você ganha Camuflagem 1 (Ganha +5 de Defesa e recebe +1 dado no ataque furtivo)."},{"n":"Teia Desesperada","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"Área de 4.5m","Duração":"Cena","Resistência":"Atletismo reduz","Custo":"5 PE | 1d4+2 de Crença","Efeito":""},"t":"Você cria correntes roxas nessa área que agarram o alvo buscando prender ele. Um ser na teia pode gastar uma ação padrão de atletismo (DT BOM) ou causar 20 de dano na corrente. Seres ficam agarrados, caso passem só ficam com desvantagem no próximo teste."},{"n":"Monocular","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"Sustentado (Teste de Espiritismo DT extremo)","Custo":"5 PE | 1d6+3 de Crença","Efeito":""},"t":"Você une seus olhos, os transformando em apenas um grande e único olho extremamente perceptível e sensível. Você recebe vantagem e +2 em Investigação, Percepção e Análise. Além disso, ao utilizar a ação de mirar, receberá vantagem em seu próximo teste de ataque à distância. Entretanto, pela sensibilidade advinda deste grande olho,você recebe desvantagem e -3 em testes para resistir a qualquer efeito que forneça as condições ofuscado ou Cego."},{"n":"Sentir Sangue","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Cone de 9 metros","Duração":"Instantânea","Custo":"5 PE | 1d6+3 de Crença","Efeito":""},"t":"Você eleva seus sentidos momentaneamente ao ponto de serem capazes de detectar o fluxo sanguíneo, ouvir os batimentos cardíacos e até mesmo sentir o odor do medo dos seres. Ao utilizar este ritual, você irá detectar qualquer condição que esteja afetando alvos na área e saber quantos PV possuem atualmente. Se existir um ser escondido na área, você receberá vantagens e +2 no teste"},{"n":"Armadura de Sangue","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"Você","Duração":"Instantânea","Custo":"4 PE | 1d6+2 de Crença","Efeito":""},"t":"Seu sangue escorre para fora do corpo, cobrindo-o sob a forma de uma carapaça que fornece +5 em Defesa e 3 de DR . Esse bônus é cumulativo com equipamentos mas não com outros rituais"},{"n":"Chamas do Desespero","c":{"Execução":"Padrão","Alcance":"Curto","Alvo":"Veja Texto","Duração":"Cena","Custo":"5 PE | 1d8+3 de Crença"},"t":"Você manipula o calor e o fogo. Ao conjurar o ritual, escolha um dos seguintes efeitos.\nChamejar: o alvo é uma arma corpo a corpo. Ela causa +1d6 pontos de dano de fogo.\nEsquentar: o alvo é um objeto, que começa a esquentar. Ele sofre 1d6 pontos de dano de fogo por rodada e causa o mesmo dano a qualquer ser que o esteja empunhando ou vestindo. A critério do mestre, o objeto ou o ser pode pegar fogo. Um ser pode gastar uma ação completa para resfriar o objeto (jogando areia ou se jogando numa fonte de água próxima, por exemplo) e cancelar o efeito do ritual.\nExtinguir: o alvo é uma chama de tamanho Grande ou menor, que é apagada. Isso cria uma nuvem de fumaça que ocupa uma esfera de 3m de raio centrada onde estava a chama. Dentro da fumaça, os seres têm vantagem em furtividade.\nModelar: o alvo é uma chama de tamanho Grande ou menor. À cada rodada, você pode gastar uma ação livre para movimentá-la 9m em qualquer direção. Se atravessar o espaço ocupado por um ser, ela causa 3d6 pontos de dano de fogo nele. Um ser só pode sofrer dano dessa maneira uma vez por rodada.\nDiscente (+3 PE): muda a duração para sustentada e adiciona “Resistência: Reflexos reduz à metade” Em vez do normal, uma vez por rodada você pode gastar uma ação de movimento para projetar uma labareda, num alvo em alcance curto. O alvo sofre 4d6 pontos de dano de Fogo ou Desespero (Reflexos reduz à metade)."},{"n":"Consumir Células","c":{"Execução":"Padrão","Alcance":"Pessoal","Alvo":"Você","Duração":"instantânea","Custo":"4 PE | 1d6+3 de Crença"},"t":"Você suga uma pequena porção do tempo de vida de plantas, insetos e até mesmo do solo ao redor, gerando lodo e recebendo 3d6 pontos de vida temporários. Os PV temporários desaparecem ao final da cena.\nDiscente (+4 PE): muda os PV temporários recebidos para 6d6."},{"n":"Corpo Sanguíneo","c":{"Execução":"Padrão","Alcance":"Toque","Alvo":"1 pessoa ou animal","Duração":"cena","Custo":"4 PE | 1d4+2 de Crença"},"t":"Este ritual modifica a biologia do alvo para permitir a sobrevivência em ambientes hostis. O alvo fica imune a calor e frio extremos, pode respirar na água se respirar ar (ou vice-versa) e não sufoca em fumaça densa.\nDiscente (+2 PE): muda a duração para 1 dia."},{"n":"Vórtice Químico","c":{"Execução":"padrão","Alcance":"médio","Área":"nuvem com 6m de raio","Duração":"instantânea","Resistência":"Fortitude parcial (veja texto)","Custo":"4 PE | 1d6+3 de Crença"},"t":"Cria uma explosão de emanações tóxicas. Seres na área sofrem 4d8 pontos de dano químico e ficam enjoados por 1 rodada. Se passarem na resistência, sofrem metade do dano e não ficam enjoados.\nDiscente(+3 PE) Muda para 6d8 de dano de Escuridão"},{"n":"Frenesi","c":{"Execução":"padrão","Alcance":"toque","Alvo":"1 pessoa","Duração":"cena","Custo":"5 PE | 1d8+3 de Crença"},"t":"O alvo entra em um frenesi, aumentando sua agressividade e capacidade de luta. Ele recebe +2 em testes de ataque e rolagens de dano corpo a corpo e DR 2 contra dano balístico, corte, impacto e perfuração. Enquanto o efeito durar, o alvo não pode fazer nenhuma ação que exige calma e concentração (como usar a perícia Furtividade ou conjurar rituais), e deve sempre atacar um alvo em sua rodada, mesmo que seja um aliado se ele for o único a seu alcance.\nDiscente (+2 PE): além do normal, sempre que o alvo usar a ação agredir, pode fazer um ataque corpo a corpo adicional contra o mesmo alvo."},{"n":"Vacuidade Aquática","c":{"Execução":"padrão","Alcance":"longo","Área":"esfera com 30m de raio","Duração":"cena","Resistência":"veja texto","Custo":"5 PE | 1d8+4 de Crença"},"t":"Você canaliza Energia sobre um corpo de água, para que ele adquira movimentos e comportamentos paranormais e caóticos. Ao conjurar o ritual, escolha um dos seguintes efeitos.\nCongelar: toda a água mundana na área é congelada. Seres nadando na área ficam imóveis; escapar exige gastar uma ação padrão e passar num teste de Atletismo (DT igual a um teste de espiritismo).\nDerreter: gelo mundano na área vira água e o ritual termina. A critério do mestre, isso pode criar terreno difícil.\nEnchente: eleva o nível da água mundana na área em até 4,5m. A sua escolha, muda área para “alvo: uma embarcação” O alvo recebe +6m em seu deslocamento pela duração do efeito.\nEvaporar: toda a água e gelo mundano na área evaporam instantaneamente e o ritual termina. Qualquer ser vivo na área sofre 5d8 de dano de escuridão. O Vapor é convertido em uma espécie de fuligem que ataca todos. (Fortitude reduz à metade). Criaturas Fantasmagóricas tomam o dobro do dano\nPartir: diminui o nível de toda água mundana na área em até 4,5m. Em um corpo d'água raso, isso abre um caminho seco, que pode ser atravessado a pé. Em um corpo d'água profundo, cria um redemoinho que pode prender barcos (um teste de Pilotagem com DT igual à do ritual permite ao piloto livrar a embarcação).\nVerdadeiro (+5 PE): aumenta o deslocamento de enchente para +12m e o dano de evaporar para 8d8"},{"n":"Tentáculos Obsidiana","c":{"Execução":"padrão","Alcance":"médio","Área":"círculo com 6m de raio","Duração":"cena","Custo":"5 PE | 1d6+3 de Crença"},"t":"Uma fenda sombria se abre no chão, de onde surgem tentáculos feitos de lodo. Ao conjurar o ritual e no início de cada um de seus turnos, você faz um teste da manobra agarrar (usando Espiritismo em vez de Luta) contra cada alvo na área. Se você vencer, o ser é agarrado; se já estava agarrado, é esmagado, sofrendo 4d6 pontos de dano (metade impacto, metade Escuridão). A área do ritual conta como terreno difícil. Os tentáculos são imunes a danos de corte e balístico."},{"n":"Vomitar Pestes","c":{"Execução":"padrão","Alcance":"médio","Efeito":"1 enxame Grande (quadrado de 3m)","Duração":"sustentada","Resistência":"Reflexos reduz à metade","Custo":"5 PE | 1d8+3 de Crença"},"t":"Você vomita um enxame de pequenas criaturas viscerais, que surge em um ponto adjacente a sua escolha. O enxame pode passar pelo espaço de outros seres e não impede que outros seres entrem no espaço dele. No final de cada um de seus turnos, o enxame causa 4d10 pontos de dano de sangue a qualquer ser no espaço dele (Reflexos reduz à metade). Você pode gastar uma ação de movimento para mover o enxame com deslocamento de 9m."}]};
let S={agentes:{},atual:null,cfg:{tema:"padrao",escala:100},migrado:false};
let timer,filtro="Todos",pg=0,catsFechadas=false,dadoBusy=false;

/* ---------- Persistência ---------- */
function novaFicha(nome){return{id:uid(),nome:nome||"Novo Espectro",classe:"",ocupacao:"",foto:PH,periciasBase:{},armas:[],inv:[],mochila:1,poderes:[],paginas:[{t:"",d:""}],stats:{pvA:20,pvM:20,sanA:20,sanM:20,peA:10,peM:10,crA:10,crM:10}}}
function norm(d){const b=novaFicha(d.nome);const f=Object.assign(b,d);
 f.id=f.id||uid();f.periciasBase=f.periciasBase||{};f.armas=f.armas||[];f.stats=Object.assign(b.stats,f.stats||{});
 f.inv=Array.isArray(d.inv)?d.inv:(Array.isArray(d.inventario)?d.inventario:[]);delete f.inventario;
 if(f.periciasBase["análise"]!==undefined){if(f.periciasBase["analisar"]===undefined)f.periciasBase["analisar"]=f.periciasBase["análise"];delete f.periciasBase["análise"]}
 if(!Array.isArray(d.paginas)||!d.paginas.length)f.paginas=[{t:d.notas||"",d:d.desenho||""}];delete f.notas;delete f.desenho;
 f.paginas=f.paginas.map(p=>({t:(p&&p.t)||"",d:(p&&p.d)||""}));
 if(f.mochila===true)f.mochila=2;if(!f.mochila||f.mochila<1||f.mochila>3)f.mochila=1;
 if(typeof f.poderes==="string"){f.poderes=f.poderes.trim()?[{id:uid(),tipo:"Habilidade de Classe",nome:"Notas anteriores",custo:"",texto:f.poderes,aberto:false}]:[]}
 if(!Array.isArray(f.poderes))f.poderes=[];
 if(!f.foto||/via\.placeholder/.test(f.foto))f.foto=PH;
 return f}
function F(){return S.agentes[S.atual]}
function load(){
 try{const r=localStorage.getItem("espectral_v2");if(r){const p=JSON.parse(r);S=Object.assign(S,p);S.cfg=Object.assign({tema:"padrao",escala:100},p.cfg||{})}}catch(e){}
 try{if(!S.migrado){for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
   if(k&&k.indexOf("agente_")===0){try{const d=norm(JSON.parse(localStorage.getItem(k)));S.agentes[d.id]=d}catch(e){}}}
   S.migrado=true}}catch(e){}
 for(const id in S.agentes)S.agentes[id]=norm(S.agentes[id]);
 if(!S.agentes[S.atual]){const ids=Object.keys(S.agentes);if(ids.length)S.atual=ids[0];else{const f=novaFicha();S.agentes[f.id]=f;S.atual=f.id}}}
function salvar(){clearTimeout(timer);$("salvo").classList.remove("v");$("salvo").textContent="… salvando";
 timer=setTimeout(()=>{try{localStorage.setItem("espectral_v2",JSON.stringify(S));$("salvo").textContent="● salvo";$("salvo").classList.add("v")}
 catch(e){$("salvo").textContent="⚠ não foi possível salvar — use ⚙ Exportar backup"}},250)}
function campo(k,v){F()[k]=v;if(k==="nome"||k==="classe")lista();salvar()}

function notasInit(){const dc=$("nCv");
 $("nTools").innerHTML=CORES.map(c=>`<button class="sw ${c===dr.cor?"on":""}" style="background:${c}" data-c="${c}" onclick="setCor('${c}')" aria-label="Cor"></button>`).join("")+
 '<input type="range" min="1" max="24" value="4" title="Espessura" oninput="dr.tam=+this.value"><button class="btn sm" id="bBorr" onclick="toggleBorr()">Borracha</button><button class="btn sm" onclick="desfazer()">↶ Desfazer</button><button class="btn red sm" onclick="limparDes()">Limpar</button>';
 const pt=e=>{const r=dc.getBoundingClientRect();return{x:(e.clientX-r.left)*dc.width/r.width,y:(e.clientY-r.top)*dc.height/r.height}};
 dc.addEventListener("pointerdown",e=>{e.preventDefault();try{dc.setPointerCapture(e.pointerId)}catch(_){}snap();dr.ativo=true;dr.last=pt(e);traco(dr.last,dr.last)});
 dc.addEventListener("pointermove",e=>{if(!dr.ativo)return;const p=pt(e);traco(dr.last,p);dr.last=p});
 const fim=()=>{if(!dr.ativo)return;dr.ativo=false;gravaDes()};
 dc.addEventListener("pointerup",fim);dc.addEventListener("pointercancel",fim)}
function traco(a,b){const x=$("nCv").getContext("2d");x.globalCompositeOperation=dr.borr?"destination-out":"source-over";x.strokeStyle=dr.cor;x.lineWidth=dr.borr?dr.tam*3:dr.tam;x.lineCap=x.lineJoin="round";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x+.01,b.y);x.stroke()}
function snap(){const c=$("nCv");dr.hist.push(c.getContext("2d").getImageData(0,0,c.width,c.height));if(dr.hist.length>10)dr.hist.shift()}
function gravaDes(){nPag().d=$("nCv").toDataURL("image/webp",.85);salvar()}
function setCor(c){dr.cor=c;dr.borr=false;marcaFerr()}
function toggleBorr(){dr.borr=!dr.borr;marcaFerr()}
function marcaFerr(){document.querySelectorAll("#nTools .sw").forEach(b=>b.classList.toggle("on",!dr.borr&&b.dataset.c===dr.cor));$("bBorr").classList.toggle("on",dr.borr)}
function desfazer(){if(!dr.hist.length)return;$("nCv").getContext("2d").putImageData(dr.hist.pop(),0,0);gravaDes()}
function limparDes(){ask("Apagar o desenho desta página?",()=>{snap();const c=$("nCv");c.getContext("2d").clearRect(0,0,c.width,c.height);gravaDes()},{ok:"Apagar"})}
function notaModo(a){$("nStage").classList.toggle("des",a==="des");$("nTools").style.display=a==="des"?"":"none";document.querySelectorAll("#nAbas .btn").forEach(b=>b.classList.toggle("on",b.dataset.a===a))}
function carregaPag(){const f=F(),p=nPag(),c=$("nCv"),x=c.getContext("2d");$("nTxt").value=p.t||"";x.globalCompositeOperation="source-over";x.clearRect(0,0,c.width,c.height);dr.hist=[];
 if(p.d){const im=new Image(),k=np;im.onload=()=>{if(k===np)x.drawImage(im,0,0,c.width,c.height)};im.src=p.d}
 $("nSel").innerHTML=f.paginas.map((_,i)=>`<option value="${i}" ${i===np?"selected":""}>Página ${i+1} / ${f.paginas.length}</option>`).join("")}
function irPag(i){np=Math.max(0,Math.min(F().paginas.length-1,i));carregaPag()}
function addPag(){F().paginas.push({t:"",d:""});np=F().paginas.length-1;carregaPag();salvar()}
function delPag(){const f=F();ask("Apagar esta página de anotações?",()=>{if(f.paginas.length>1)f.paginas.splice(np,1);else f.paginas[0]={t:"",d:""};np=Math.min(np,f.paginas.length-1);carregaPag();salvar()},{ok:"Apagar"})}
function abrirNotas(){np=0;modal("mNotas",1);notaModo("esc");carregaPag()}
/* ---------- Backup / armazenamento ---------- */
function testeArm(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}}
const armOk=testeArm();
function abrirCfg(){const o=String(location.protocol)==="file:"?"arquivo local (file://)":String(location.origin);
 $("infoArm").textContent="Salvamento automático: "+(armOk?"ativo no navegador (localStorage)":"INDISPONÍVEL neste modo de abertura")+" · origem: "+o+". Os dados ficam só neste navegador e nesta origem; use o backup para levar para outro lugar.";modal("mCfg",1)}
function exportar(){const b=new Blob([JSON.stringify({espectral:2,atual:S.atual,agentes:S.agentes})],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="espectral-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function importar(inp){const file=inp.files[0];if(!file)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);const L=d&&d.agentes?Object.values(d.agentes):Array.isArray(d)?d:(d&&d.nome?[d]:[]);if(!L.length)throw 0;
  let ult=null;L.forEach(x=>{const f=norm(x);S.agentes[f.id]=f;ult=f.id});abrir(ult);ask(L.length+" espectro(s) importado(s).",null,{ok:"OK"})}catch(_){ask("Arquivo inválido: não encontrei fichas nele.",null,{ok:"OK"})}};
 r.readAsText(file);inp.value=""}

let askCb=null;
