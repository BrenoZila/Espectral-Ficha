function askFim(ok){const cb=askCb,v=$("askIn").value;askCb=null;modal("mAsk",0);if(ok&&cb)cb(v)}
/* ---------- Sidebar / Agentes ---------- */
function lista(){$("lista").innerHTML=Object.values(S.agentes).map(a=>`<div class="ag ${a.id===S.atual?"on":""}" onclick="abrir('${a.id}')"><img src="${esc(a.foto)}" alt=""><div><b>${esc(a.nome)||"Sem nome"}</b><small>${esc(a.classe)||"S/ classe"}</small></div></div>`).join("")}

function deletar(){ask("Apagar permanentemente este espectro?",()=>{delete S.agentes[S.atual];
 const ids=Object.keys(S.agentes);if(ids.length)S.atual=ids[0];else{const f=novaFicha();S.agentes[f.id]=f;S.atual=f.id}
 preencher();lista();salvar()},{ok:"Apagar"})}

/* ---------- Construção da UI ---------- */
function init(){
 $("tabs").innerHTML=[["esp","Espectro"],["tes","Testes"],["arm","Arsenal"],["pod","Poderes"],["car","Carga"]].map((t,i)=>`<button class="${i?"":"on"}" data-t="${t[0]}" onclick="aba('${t[0]}')">${t[1]}</button>`).join("");

 $("stats").innerHTML=STATS.map(s=>`<div class="st"><label><span>${s[1]}</span><span class="n"><input type="number" id="${s[0]}A" oninput="stat()"> / <input type="number" id="${s[0]}M" oninput="stat()"></span></label><div class="bar"><i id="b_${s[0]}" style="background:${s[2]};box-shadow:0 0 8px ${s[2]}"></i></div></div>`).join("");
 $("cats").innerHTML=CATS.map((c,i)=>`<div class="cat" id="cat${i}"><header onclick="this.parentNode.classList.toggle('fechado')"><span>${c[0]}</span><span class="tag" id="soma${i}">0</span></header><div class="grid">${c[1].map(p=>`<div class="per"><label>${p} <em id="bn_${p}"></em></label><div><input type="number" min="0" id="in_${p}" oninput="base('${p}',this.value)"><strong id="t_${p}">0</strong></div></div>`).join("")}</div></div>`).join("");
 $("selTeste").innerHTML=CATS.map(c=>`<optgroup label="${c[0]}">${c[1].map(p=>`<option value="${p}">${p.toUpperCase()}</option>`).join("")}</optgroup>`).join("");
 $("filtros").innerHTML=["Todos","Habilidade de Classe","Multiclasse","Ritual"].map(f=>`<button class="btn sm" data-f="${f}" onclick="setFiltro('${f}')">${f==="Habilidade de Classe"?"Classe":f==="Ritual"?"Rituais":f}</button>`).join("");
 $("temas").innerHTML=Object.keys(TEMAS).map(k=>`<button class="btn" data-k="${k}" onclick="setTema('${k}')">${TEMAS[k][0]}</button>`).join("");
 $("inFoto").value="";
}
function aba(t){document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on",s.id==="t-"+t));document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
function toggleCats(){catsFechadas=!catsFechadas;document.querySelectorAll(".cat").forEach(c=>c.classList.toggle("fechado",catsFechadas))}
function modal(id,on){$(id).classList.toggle("on",!!on)}

function preencher(){const f=F();
 $("nome").value=f.nome;$("classe").value=f.classe;$("ocup").value=f.ocupacao||"";$("foto").src=f.foto;
 STATS.forEach(s=>{$(s[0]+"A").value=f.stats[s[0]+"A"];$(s[0]+"M").value=f.stats[s[0]+"M"]});
 CATS.forEach(c=>c[1].forEach(p=>$("in_"+p).value=f.periciasBase[p]||0));
 $("selMoch").value=f.mochila;
 stat(true);renderArmas();renderPoderes();renderItens();calc()}

/* ---------- Status ---------- */
function stat(sem){const f=F();STATS.forEach(s=>{const k=s[0],a=parseInt($(k+"A").value)||0,m=parseInt($(k+"M").value)||0;
 f.stats[k+"A"]=a;f.stats[k+"M"]=m;$("b_"+k).style.width=(m>0?Math.max(0,Math.min(100,a/m*100)):0)+"%"});
 if(!sem)salvar()}

/* ---------- Perícias ---------- */
function lvl(p){const f=F();return(f.periciasBase[p]||0)+((BON[f.classe]||{})[p]||0)}
function base(p,v){F().periciasBase[p]=Math.max(0,parseInt(v)||0);calc();salvar()}
function calc(){const f=F(),bn=BON[f.classe]||{};let ess=0,ger=0;
 CATS.forEach((c,i)=>{let soma=0;c[1].forEach(p=>{const t=lvl(p),b=bn[p]||0;$("t_"+p).textContent=t;$("bn_"+p).textContent=b?"+"+b:"";soma+=f.periciasBase[p]||0;if(i===0)ess+=f.periciasBase[p]||0;else ger+=f.periciasBase[p]||0});$("soma"+i).textContent="Total "+soma});
 $("sEss").textContent="Essenciais "+ess+"/45";$("sGer").textContent="Gerais "+ger+"/120";
 $("sEss").style.color=ess>45?"var(--bad)":"";$("sGer").style.color=ger>120?"var(--bad)":"";
 calcCarga()}

/* ---------- Teste de perícia ---------- */
function rolarTeste(){if(dadoBusy)return;const p=$("selTeste").value,mod=parseInt($("modTeste").value)||0,n=Math.min(20,lvl(p)),d=$("d20");
 dadoBusy=true;d.classList.remove("rola");void d.offsetWidth;d.classList.add("rola");$("resT").textContent="";
 const iv=setInterval(()=>d.textContent=1+Math.floor(Math.random()*20),60);
 setTimeout(()=>{clearInterval(iv);dadoBusy=false;const r=1+Math.floor(Math.random()*20),tot=r+mod,th=TAB[n]||[0,0,0];
  d.textContent=r;let g="Fracasso",c="var(--bad)";
  if(th[2]&&tot>=th[2]){g="Extremo!";c="#00ffd0"}else if(th[1]&&tot>=th[1]){g="Bom";c="var(--ok)"}else if(th[0]&&tot>=th[0]){g="Normal";c="#ffe14d"}
  $("resT").innerHTML=`<span style="color:${c}">${g}</span>`;
  $("detT").textContent=`${p.toUpperCase()} nível ${n} — d20 (${r}) ${mod<0?"-":"+"} ${Math.abs(mod)} = ${tot}`+(n===0?" — sem pontos na perícia":"");
  $("tabT").innerHTML=th[0]?`<span>Normal ≥ ${th[0]}</span><span>Bom ${th[1]?"≥ "+th[1]:"—"}</span><span>Extremo ${th[2]?"≥ "+th[2]:"—"}</span>`:"<span>Nível 0: apenas Fracasso</span>"},700)}

/* ---------- Arsenal ---------- */
function addArma(){const n=$("aNome").value.trim(),d=$("aDano").value.trim();if(!n||!/\d*d\d+|\d+/.test(d))return alert("Informe nome e dano válido (ex: 2d6+4).");
 F().armas.push({n,d});$("aNome").value="";$("aDano").value="";renderArmas();salvar()}
function renderArmas(){$("armas").innerHTML=F().armas.map((a,i)=>`<div class="item"><strong>${esc(a.n)}</strong><span style="font-family:var(--mono)">${esc(a.d)}</span><span><button class="btn sm" onclick="rolarDano(${i})">⚔ Rolar</button> <button class="btn red sm" onclick="delArma(${i})">✖</button></span></div>`).join("")||'<div class="det">Nenhuma arma registrada.</div>'}
function delArma(i){F().armas.splice(i,1);renderArmas();salvar()}
function rolarDano(i){const a=F().armas[i],bandeja=$("bandeja");bandeja.innerHTML="";$("resD").textContent="";$("detD").textContent="";
 const toks=a.d.replace(/\s+/g,"").match(/[+-]?(\d*d\d+|\d+)/gi);if(!toks)return;let total=0,partes=[],k=0;
 toks.forEach(t=>{let sg=1;if(t[0]==="-"){sg=-1;t=t.slice(1)}else if(t[0]==="+")t=t.slice(1);
  if(/d/i.test(t)){const[q,fc]=t.toLowerCase().split("d").map(Number),qt=Math.min(q||1,40),fa=Math.max(fc,1);let rs=[];
   for(let j=0;j<qt;j++){const r=1+Math.floor(Math.random()*fa);rs.push(r);const el=document.createElement("div");el.className="die";el.style.animationDelay=(k++*70)+"ms";el.innerHTML=r+"<small>d"+fa+"</small>";bandeja.appendChild(el)}
   const s=rs.reduce((x,y)=>x+y,0);total+=sg*s;partes.push((sg<0?"-":"")+"["+rs.join("+")+"]")}
  else{total+=sg*parseInt(t);partes.push((sg<0?"-":"+")+t)}});
 setTimeout(()=>{$("resD").textContent=`${a.n}: ${total} de dano`;$("detD").textContent=`${a.d} → ${partes.join(" ").replace(/\s\+/g," + ")} = ${total}`},300+k*70)}

/* ---------- Poderes / Grimório ---------- */
function setFiltro(f){filtro=f;renderPoderes()}
function addPoder(tipo){F().poderes.push({id:uid(),tipo,nome:"Novo "+(tipo==="Ritual"?"Ritual":"Poder"),custo:"",texto:"",aberto:true,exp:false,expDe:""});renderPoderes();salvar()}
function pd(i,k,v){const p=F().poderes[i];p[k]=v;if(k==="nome"){const t=$("pt"+i);if(t)t.textContent=v||"(sem nome)"}salvar()}
function togglePd(i){const p=F().poderes[i];p.aberto=!p.aberto;renderPoderes();salvar()}
function delPd(i){const p=F().poderes[i];if(!p)return;ask("Remover \""+(p.nome||"este poder")+"\"?",()=>{F().poderes.splice(i,1);renderPoderes();if($("mLivro").classList.contains("on"))renderLivro(false);salvar()},{ok:"Remover"})}
function renderPoderes(){acesso();document.querySelectorAll("#filtros .btn").forEach(b=>b.classList.toggle("on",b.dataset.f===filtro));
 const L=F().poderes.map((p,i)=>[p,i]).filter(x=>filtro==="Todos"||x[0].tipo===filtro);
 $("poderes").innerHTML=L.map(([p,i])=>`<div class="card ${p.aberto?"aberto":""}"><header onclick="togglePd(${i})"><span class="tp">${p.tipo==="Habilidade de Classe"?(p.grupo?esc(p.grupo):"Classe"):p.tipo}</span><b id="pt${i}" style="flex:1">${esc(p.nome)||"(sem nome)"}</b><span class="det">${p.custo?esc(p.custo):""}</span><span>${p.aberto?"▲":"▼"}</span></header>
 <div class="cb"><input placeholder="Nome" value="${esc(p.nome)}" oninput="pd(${i},'nome',this.value)"><input placeholder="Custo (ex: 3 PE)" value="${esc(p.custo)}" oninput="pd(${i},'custo',this.value)">
 <select onchange="pd(${i},'tipo',this.value);renderPoderes()">${["Habilidade de Classe","Multiclasse","Ritual"].map(t=>`<option ${t===p.tipo?"selected":""}>${t}</option>`).join("")}</select>
 <textarea class="full" placeholder="Descrição / efeito" oninput="pd(${i},'texto',this.value)">${esc(p.texto)}</textarea>
 ${p.tipo==="Multiclasse"?`<label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${p.exp?"checked":""} onchange="pd(${i},'exp',this.checked);renderPoderes()"> Expansão de Conhecimento (habilidade de outra classe)</label>${p.exp?`<input class="full" placeholder="Classe / habilidade de origem" value="${esc(p.expDe)}" oninput="pd(${i},'expDe',this.value)">`:""}`:""}
 <button class="btn red sm full" onclick="delPd(${i})">Remover</button></div></div>`).join("")||'<div class="det">Nenhum poder nesta categoria.</div>'}
/* ---------- Livros de Habilidades e Rituais ---------- */
const GRUPOS=["Lutador","Mentalista","Espreitador","Inventor","Espírita","Sobrevivente","Altruísta","Multiclasse"];
let lv={tipo:"hab",grupo:"Multiclasse",sp:0};
function temExpansao(f){return f.poderes.some(p=>p.exp||/^expans[aã]o de conhecimento$/i.test((p.nome||"").trim()))}
function liberado(g){const f=F();return g==="Multiclasse"||f.classe===g||temExpansao(f)}
function sabe(r){return F().poderes.some(p=>p.ref===r)}
function acesso(){const f=F(),el=$("acesso");if(!el)return;
 el.textContent=temExpansao(f)?"Expansão de Conhecimento ativa: habilidades de todas as classes liberadas.":(f.classe?"Habilidades liberadas: "+f.classe+" + Multiclasse. Rituais: todos.":"Escolha uma classe na aba Espectro. Por enquanto só Multiclasse e Rituais estão liberados.")}
function entradas(){return lv.tipo==="rit"?LIVRO.rit:(liberado(lv.grupo)?LIVRO.hab[lv.grupo]:null)}
function refDe(e){return lv.tipo==="rit"?"rit:"+e.n:"hab:"+lv.grupo+":"+e.n}
function abrirLivro(tipo){const f=F(),b=$("bk"),c=$("capa");lv.tipo=tipo;lv.sp=0;lv.grupo=GRUPOS.indexOf(f.classe)>=0?f.classe:"Multiclasse";
 modal("mLivro",1);b.classList.remove("aberto");c.style.display="";$("capaT").textContent=tipo==="hab"?"Livro de Habilidades":"Livro de Rituais";
 renderLivro(false);void b.offsetWidth;setTimeout(()=>b.classList.add("aberto"),80);setTimeout(()=>{c.style.display="none"},1400)}
function setGrupo(g){lv.grupo=g;lv.sp=0;renderLivro(true)}
function vira(d){lv.sp+=d;renderLivro(true)}
function ir(i){lv.sp=Math.floor(i/2);renderLivro(true)}
function pagina(e,i){const r=refDe(e),ok=sabe(r);let c;
 if(lv.tipo==="rit")c=`<h3>${esc(e.n)}${e.m?" <small>(1)</small>":""}</h3>`+(e.c?`<div class="campos">${Object.keys(e.c).map(k=>`<span><b>${esc(k)}:</b> ${esc(e.c[k])}</span>`).join("")}</div>`:"");
 else c=`<h3>${esc(e.n)}</h3><div class="det" style="text-align:left">${esc(lv.grupo)}</div>`;
 const btn=e.nota?"":(ok?`<button class="btn red sm" onclick="esquecer(${i})">Esquecer</button>`:`<button class="btn sm" onclick="aprender(${i})">Aprender</button>`);
 return `<div class="pg">${c}<p>${esc(e.t)}</p><div class="rod"><span class="det">${ok?"✔ aprendida · ":""}pág. ${i+1}</span>${btn}</div></div>`}
function renderLivro(anim){const L=entradas(),sp=$("spread"),f=F();
 $("marc").innerHTML=lv.tipo==="hab"?GRUPOS.map(g=>`<button class="btn sm ${g===lv.grupo?"on":""}" onclick="setGrupo('${g}')">${liberado(g)?"":"🔒 "}${g}</button>`).join(""):'<span class="det">Rituais: disponíveis para qualquer classe</span>';
 if(!L){sp.className="spread";$("irPara").innerHTML="";$("pgNum").textContent="";
  sp.innerHTML=`<div class="pg lock"><h3>🔒 ${esc(lv.grupo)}</h3><p style="flex:none">${f.classe?"Estas habilidades só podem ser escolhidas por um(a) "+esc(lv.grupo)+".":"Escolha uma classe na aba Espectro."}\n\nAprenda a habilidade multiclasse “Expansão de Conhecimento” para liberar as habilidades de todas as classes.</p></div>`;return}
 const tot=Math.ceil(L.length/2);lv.sp=Math.max(0,Math.min(lv.sp,tot-1));
 sp.className="spread"+(anim?" anim":"");
 sp.innerHTML=L.slice(lv.sp*2,lv.sp*2+2).map((e,k)=>pagina(e,lv.sp*2+k)).join("");
 $("irPara").innerHTML=L.map((e,i)=>`<option value="${i}" ${i===lv.sp*2?"selected":""}>${esc(e.n)}</option>`).join("");
 $("pgNum").textContent=(lv.sp*2+1)+"–"+Math.min(L.length,lv.sp*2+2)+" / "+L.length}
function ritTexto(e){return Object.keys(e.c||{}).map(k=>k+": "+e.c[k]).join("\n")+"\n\n"+e.t}
function aprender(i){const e=entradas()[i],f=F(),r=refDe(e),rit=lv.tipo==="rit";if(!e||e.nota||sabe(r))return;if(!rit&&!liberado(lv.grupo))return;
 f.poderes.push({id:uid(),ref:r,grupo:rit?"":lv.grupo,tipo:rit?"Ritual":(lv.grupo==="Multiclasse"?"Multiclasse":"Habilidade de Classe"),nome:e.n,custo:rit?((e.c||{}).Custo||""):"",texto:rit?ritTexto(e):e.t,aberto:false,exp:e.n==="Expansão de Conhecimento",expDe:""});
 renderPoderes();renderLivro(false);salvar()}
function esquecer(i){const e=entradas()[i],r=refDe(e),k=F().poderes.findIndex(p=>p.ref===r);if(k<0)return;F().poderes.splice(k,1);renderPoderes();renderLivro(false);salvar()}

/* ---------- Carga ---------- */
function addItem(){F().inv.push({n:"Novo item",p:1});renderItens();salvar()}
function renderItens(){$("itens").innerHTML=F().inv.map((it,i)=>`<div class="item inv"><input value="${esc(it.n)}" oninput="F().inv[${i}].n=this.value;salvar()"><input type="number" min="0" step="0.5" value="${esc(it.p)}" title="Peso" oninput="F().inv[${i}].p=parseFloat(this.value)||0;calcCarga();salvar()"><button class="btn red sm" onclick="F().inv.splice(${i},1);renderItens();salvar()">✖</button></div>`).join("");calcCarga()}
function calcCarga(){const f=F(),forca=lvl("força"),m=f.mochila||1,max=forca*m;let at=0;f.inv.forEach(i=>at+=parseFloat(i.p)||0);at=Math.round(at*100)/100;
 const over=at>max,pct=max>0?Math.min(100,at/max*100):(at>0?100:0);
 $("cargaBar").style.width=pct+"%";$("cargaBox").classList.toggle("over",over);
 $("cargaLbl").textContent=`Carga: ${at} / ${max}`+(over?" — SOBRECARGA!":"");
 $("cargaInfo").textContent=`Força ${forca} × ${m} = Carga Máxima ${max}`+(over?` (excesso de ${Math.round((at-max)*100)/100})`:"")}

/* ---------- Foto ---------- */
function upFoto(inp){const file=inp.files[0];if(!file)return;const r=new FileReader();
 r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  const u=c.toDataURL("image/jpeg",.8);F().foto=u;$("foto").src=u;lista();salvar()};im.src=e.target.result};r.readAsDataURL(file);inp.value=""}

/* ---------- Temas & escala ---------- */
function setTema(k){S.cfg.tema=k;document.body.dataset.tema=k;document.querySelectorAll("#temas .btn").forEach(b=>b.classList.toggle("on",b.dataset.k===k));spawn();salvar()}
function setEscala(v){S.cfg.escala=v;document.body.style.zoom=v/100;$("escLbl").textContent=v+"%";$("esc").value=v;salvar()}

/* ---------- Fundo animado ---------- */
const cv=$("bg"),cx=cv.getContext("2d");let W=0,H=0,P=[];
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
function mk(k){const r=Math.random,p={x:r()*W,y:r()*H,ph:r()*6.28,vx:0,vy:0,r:10,a:.2};
 if(k==="poeira"){p.r=2+r()*4;p.vy=-.15-r()*.2;p.vx=(r()-.5)*.2;p.a=.5}
 else if(k==="visc"){p.r=14+r()*46;p.vy=-.2-r()*.6;p.vx=(r()-.5)*.3;p.a=.22}
 else if(k==="nevoa"){p.r=110+r()*170;p.vx=(r()-.5)*.5;p.vy=(r()-.5)*.2;p.a=.1}
 else if(k==="espirito"){p.r=16+r()*26;p.vy=-.3-r()*.4;p.a=.2}
 else{p.r=12+r()*50;p.vy=.15+r()*.5;p.vx=(r()-.5)*.1;p.a=.16}
 return p}
function spawn(){const T=TEMAS[S.cfg.tema]||TEMAS.padrao;P=Array.from({length:T[3]==="nevoa"?18:40},()=>mk(T[3]))}
function orb(x,y,r,c,a){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,6.2832);cx.fill()}
function frame(t){const T=TEMAS[S.cfg.tema]||TEMAS.padrao,c=T[1].join(","),k=T[3];
 cx.fillStyle=T[2];cx.fillRect(0,0,W,H);
 if(k==="visc"){cx.fillStyle=`rgba(${c},${.04+.04*Math.sin(t/450)})`;cx.fillRect(0,0,W,H)}
 P.forEach(p=>{p.x+=p.vx+(k==="espirito"?Math.sin(t/900+p.ph)*.5:0);p.y+=p.vy;
  if(p.y<-p.r*2)p.y=H+p.r;if(p.y>H+p.r*2)p.y=-p.r;if(p.x<-p.r*2)p.x=W+p.r;if(p.x>W+p.r*2)p.x=-p.r;
  const pu=.5+.5*Math.sin(t/(k==="visc"?330:1300)+p.ph);
  if(k==="lodo"){orb(p.x,p.y,p.r,"60,62,70",p.a*1.4)}else orb(p.x,p.y,p.r*(k==="visc"?.75+.45*pu:1),c,p.a*(.5+pu));
  if(k==="espirito"){cx.fillStyle="rgba(255,255,255,.35)";cx.beginPath();cx.arc(p.x-p.r*.25,p.y-p.r*.1,1.6,0,6.3);cx.arc(p.x+p.r*.25,p.y-p.r*.1,1.6,0,6.3);cx.fill()}});
 if(k==="nevoa"&&Math.random()<.1){cx.fillStyle=`rgba(${c},.14)`;cx.fillRect(Math.random()*W*.3,Math.random()*H,W*(.3+Math.random()*.7),1+Math.random()*3)}
 if(k==="lodo"){cx.fillStyle="#000";cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W+20;x+=20)cx.lineTo(x,H-34-12*Math.sin(x/60+t/1500)-8*Math.sin(x/23+t/700));cx.lineTo(W,H);cx.fill()}
 requestAnimationFrame(frame)}

/* ---------- Início ---------- */
window.addEventListener("resize",resize);
window.addEventListener("beforeunload",()=>{try{localStorage.setItem("espectral_v2",JSON.stringify(S))}catch(e){}});
init();notasInit();load();resize();
document.body.dataset.tema=S.cfg.tema;setTema(S.cfg.tema);setEscala(S.cfg.escala);
preencher();lista();requestAnimationFrame(frame);if(!armOk)$("salvo").textContent="⚠ sem armazenamento neste modo — nada será salvo (use ⚙ Exportar backup)";
</script>
